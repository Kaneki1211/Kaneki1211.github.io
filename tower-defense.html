// ========== 工具函数 ==========

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

function randRange(min, max) {
  return min + Math.random() * (max - min);
}

/** 格式化资源数值：小数值保留1位小数，大数用“万” */
function formatRes(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  if (n >= 100) return Math.floor(n).toString();
  return (Math.floor(n * 10) / 10).toString();
}

/** 加载单张图片，失败返回null */
function loadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

/** 简单音效生成器（带节流与静音） */
class SFX {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this._lastHitAt = 0;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* 无音频环境 */ }
  }
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  play(freq, duration, type = 'square', vol = 0.1) {
    if (!this.ctx || this.muted) return;
    this.resume();
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) { /* 忽略音频错误 */ }
  }
  hit() {
    const now = performance.now();
    if (now - this._lastHitAt < 70) return; // 限制多炮台叠音
    this._lastHitAt = now;
    this.play(200, 0.12, 'sawtooth', 0.05);
  }
  build() { this.play(440, 0.1, 'sine', 0.06); }
  upgrade() { this.play(660, 0.15, 'sine', 0.08); }
  bossHit() { this.play(100, 0.25, 'sawtooth', 0.1); }
  doorBreak() { this.play(60, 0.5, 'sawtooth', 0.15); }
  win() {
    this.play(523, 0.2, 'sine', 0.1);
    setTimeout(() => this.play(659, 0.2, 'sine', 0.1), 200);
    setTimeout(() => this.play(784, 0.4, 'sine', 0.1), 400);
  }
  lose() {
    this.play(300, 0.3, 'sawtooth', 0.1);
    setTimeout(() => this.play(200, 0.5, 'sawtooth', 0.1), 300);
  }
  ghost() { this.play(800, 0.6, 'sine', 0.03); }
}

/** 生成完整素材清单：key -> 候选路径数组（按顺序回退） */

  const m = {};

  // UI 与地图
  put('ui_MENU_BG', ['微恐塔防素材/UI素材/首页/局外背景图.jpg']);
  put('ui_START_BTN', ['微恐塔防素材/UI素材/首页/开始游戏按钮.png']);
  put('ui_COIN_FRAME', ['微恐塔防素材/UI素材/首页/货币持有框.png']);
  put('ui_SELECT_BG', ['微恐塔防素材/UI素材/首页/选角背景.png']);
  put('ui_WIN_RESULT', ['微恐塔防素材/UI素材/结算页/成功结算.png']);
  put('ui_LOSE_RESULT', ['微恐塔防素材/UI素材/结算页/失败结算.png']);
  put('ui_GAME_SHOP', ['微恐塔防素材/UI素材/弹窗/局内商店弹窗.png']);
  // 关卡顺序：简单=幽灵船，困难=废弃医院，炼狱=末日堡垒
  put('room_0', ['微恐塔防素材/房间地图/幽灵船.jpg']);
  put('room_1', ['微恐塔防素材/房间地图/废弃医院.png']);
  put('room_2', ['微恐塔防素材/房间地图/末日堡垒.jpg']);

  // 门 1-13
  for (let i = 1; i <= 13; i++) put('door_' + i, ['微恐塔防素材/门/透视版/' + i + '.png']);

  // 床 1-10（5级素材缺失，回退用4级外观）
  put('bed_1', ['微恐塔防素材/床/微恐床/1级床.png']);

    if (i === 5) put('bed_5', ['微恐塔防素材/床/微恐床/5.png', '微恐塔防素材/床/微恐床/4.png']);

  // 发电机 1-10（可用素材共10张）

  for (let i = 1; i <= 10; i++) put('gen_' + i, ['微恐塔防素材/发电机/发电机_' + genFiles[i - 1] + '.png']);

  // 修复台 1-3

  // 玩家（男性有效帧 0,1,2,4,5,7；女性 0-5）

    put('player_m_stand_' + f, ['微恐塔防素材/玩家/男性角色/站立-男玩家_' + f + '.png']);

/** 预加载全部素材：每个key依次尝试候选路径，失败仅记录一次 */
function preloadAssets() {
  const manifest = buildAssetManifest();
  for (const [key, paths] of Object.entries(manifest)) {
    IMG[key] = null;
    (async () => {
      for (const p of paths) {
        const img = await loadImage(p);
        if (img) { IMG[key] = img; return; }
      }
      // 全部失败保持null，渲染使用矢量兜底
    })();
  }
}

/** 建筑基类：记录网格位置与累计投入（用于25%拆除返还） */
class Building {
  constructor(type, col, row) {
    this.type = type;
    this.col = col;
    this.row = row;
    this.level = 1;
    this.investedGold = 0;
    this.investedEnergy = 0;
  }
}

/** 床（局内1个，核心经济） */
class Bed extends Building {
  constructor(col, row) {
    super('bed', col, row);
  }
  get income() { return CONFIG.BED_DATA[this.level - 1].income; }
}

/** 门（局内1个，自带等级自愈） */
class Door {
  constructor() {
    this.type = 'door';
    this.level = 1;
    this.maxHp = CONFIG.DOOR_DATA[0].hp;
    this.hp = this.maxHp;
    this.invincible = false;
    this.invincibleTimer = 0;
    this.col = 0;
    this.row = 2;
    this.investedGold = 0;
    this.investedEnergy = 0;
  }
  get regen() { return CONFIG.DOOR_DATA[this.level - 1].regen || 0; }
  update(dt) {
    if (this.invincible) {
      this.invincibleTimer -= dt;
      if (this.invincibleTimer <= 0) this.invincible = false;
    }
    // 等级自愈
    if (this.regen > 0 && this.hp > 0) {
      this.hp = Math.min(this.maxHp, this.hp + this.regen * dt);
    }
  }
  takeDamage(dmg) {
    if (this.invincible || this.hp <= 0) return;
    this.hp -= dmg;
    game.shakeAmount = 5;
    game.shakeTimer = 0.2;
    game.sfx.bossHit();
    // 能量罩：门血量跌破30%时3秒无敌，每局1次
    if (hasSpecial('shield') && !game.flags.shieldUsed && this.hp > 0 && this.hp / this.maxHp < 0.3) {
      game.flags.shieldUsed = true;
      this.invincible = true;
      this.invincibleTimer = 3;
      addFloatText(0.5, 1.9, '能量罩!', '#00BCD4');
    }
    if (this.hp <= 0) {
      this.hp = 0;
      game.sfx.doorBreak();
    }
  }
}

/** 炮台 */
class Tower extends Building {
  constructor(col, row) {
    super('tower', col, row);
    this.atkTimer = 0;
    this.target = null;
    this.angle = 0;
  }
  get baseData() { return CONFIG.TOWER_DATA[this.level - 1]; }
  get atk() {
    return this.baseData.atk * (hasSpecial('emCannon') ? 1.4 : 1);
  }
  get rangeCells() {
    return this.baseData.range * (hasSpecial('watchtower') ? 1.2 : 1);
  }
  get interval() {
    return this.baseData.interval / (hasSpecial('accelerator') ? 1.5 : 1);
  }
  update(dt) {
    this.target = this.findTarget();
    if (this.target) {
      this.angle = Math.atan2(this.target.ly - (this.row + 0.5), this.target.lx - (this.col + 0.5));
      this.atkTimer -= dt;
      if (this.atkTimer <= 0) {
        this.shoot();
        this.atkTimer = this.interval;
      }
    } else {
      this.atkTimer = Math.min(this.atkTimer, this.interval);
    }
  }
  findTarget() {
    let best = null;
    let bestDist = this.rangeCells;
    for (const boss of game.bosses) {
      if (boss.dead) continue;
      const d = Math.hypot(boss.lx - (this.col + 0.5), boss.ly - (this.row + 0.5));
      if (d < bestDist) { bestDist = d; best = boss; }
    }
    return best;
  }
  shoot() {
    if (!this.target) return;
    game.projectiles.push(new Projectile(this.col + 0.5, this.row + 0.5, this.target, this.atk));
    game.sfx.hit();
    // 零钱罐：炮台射击偷钱（与炮台等级相关）
    if (hasSpecial('piggyBank')) {
      const stolen = this.level * 2;
      game.gold += stolen;
      game.resultStats.goldEarned += stolen;
    }
  }
}

/** 发电机 */
class Generator extends Building {
  constructor(col, row) {
    super('generator', col, row);
  }
  get output() { return CONFIG.GENERATOR_DATA[this.level - 1].output; }
}

/** 矿场 */
class Mine extends Building {
  constructor(col, row, mineIndex) {
    super('mine', col, row);
    this.mineIndex = mineIndex;
  }
  get income() { return CONFIG.MINE_DATA[this.mineIndex].income; }
  get mineName() { return CONFIG.MINE_DATA[this.mineIndex].name; }
}

/** 修复台（最多4台） */
class RepairStation extends Building {
  constructor(col, row) {
    super('repair', col, row);
  }
  get pct() { return CONFIG.REPAIR_DATA[this.level - 1].pct; }
}

/** 特殊建筑（每种限1个） */
class SpecialBuilding extends Building {
  constructor(col, row, specialKey) {
    super('special', col, row);
    this.specialKey = specialKey;
  }
  get specialName() { return CONFIG.SPECIALS[this.specialKey].name; }
}

/** Boss：统一状态机 approach / attack / retreat / heal + dead */
class Boss {
  constructor() {
    this.lv = CONFIG.LEVELS[game.levelIndex];
    this.applyLevel(0);
    this.state = 'approach';
    this.stunTimer = 0;
    this.healTimer = 0;
    this.spawnLx = -1.6;
    this.lx = this.spawnLx;
    this.ly = 2.5;              // 沿中间行走线
    this.targetLx = -0.25;      // 停在门前
    this.atkTimer = 0.5;
    this.animTimer = 0;
    this.atkAnimTimer = 0;
    this.isAttacking = false;
    this.dead = false;
    this._drumstick = false;
  }
  applyLevel(idx) {
    const d = this.lv.bossData[idx];
    this.idx = idx;
    this.level = d.level;
    this.maxHp = d.hp;
    this.hp = d.hp;
    this.atk = d.atk;
    this.next = d.next || 0;
    this.atkCount = 0;
  }
  update(dt) {
    if (this.dead) return;
    this.animTimer += dt;

    // 定身（独立计时，覆盖所有状态）
    if (this.stunTimer > 0) {
      this.stunTimer -= dt;
      return;
    }

    // 回血：回到出生点后按冷却时间回满
    if (this.state === 'heal') {
      this.healTimer -= dt;
      this.hp = Math.min(this.maxHp, this.hp + (this.maxHp * dt / this.lv.healCD));
      if (this.healTimer <= 0) {
        this.hp = this.maxHp;
        this.state = 'approach';
      }
      return;
    }

    // 撤退：返回出生点
    if (this.state === 'retreat') {
      if (this.lx < this.spawnLx - 0.02) {
        this.lx = Math.min(this.spawnLx, this.lx + 0.75 * dt);
      } else {
        this.lx = this.spawnLx;
        this.state = 'heal';
        this.healTimer = this.lv.healCD;
      }
      return;
    }

    // 接近门
    if (this.state === 'approach') {
      this.isAttacking = false;
      if (this.lx < this.targetLx) {
        this.lx = Math.min(this.targetLx, this.lx + 0.5 * dt);
      }
      if (this.lx >= this.targetLx - 0.001) this.state = 'attack';
      return;
    }

    // 攻门
    this.isAttacking = true;
    this.atkAnimTimer += dt;

    // 乾坤圈：攻门期间每秒受到1%最大生命伤害（dt计，帧率无关）
    if (hasSpecial('ring')) {
      this.takeDamage(this.maxHp * 0.01 * dt, true);
    }
    if (this.dead || this.state !== 'attack') return;

    this.atkTimer -= dt;
    if (this.atkTimer <= 0) {
      this.attackDoor();
      let interval = 1.0;
      if (hasSpecial('fridge')) interval *= 1.25; // 冰箱：攻速-20%
      this.atkTimer = interval;
    }
  }
  attackDoor() {
    if (game.door) game.door.takeDamage(this.atk);
    this.atkCount++;
    // 升级：读取“升至下一级所需攻击次数”
    if (this.lv.canLevel && this.next > 0 && this.atkCount >= this.next
        && this.idx < this.lv.bossData.length - 1) {
      this.applyLevel(this.idx + 1);
      addFloatText(this.lx, this.ly - 0.8, 'Boss升级! Lv.' + this.level, '#FF5722');
    }
  }
  /** 统一伤害入口：先判死亡，再判非致死低血撤退 */
  takeDamage(dmg, silent) {
    if (this.dead || game.state !== STATE.PLAYING) return;
    this.hp -= dmg;
    if (!silent && dmg >= 1) {
      addFloatText(this.lx + randRange(-0.1, 0.1), this.ly - 0.4, '-' + Math.round(dmg), '#FF5722');
    }
    // 大鸡腿：首次跌破30%时额外造成10%最大生命伤害
    if (hasSpecial('drumstick') && !this._drumstick && this.hp > 0 && this.hp / this.maxHp < 0.3) {
      this._drumstick = true;
      this.hp -= this.maxHp * 0.1;
      addFloatText(this.lx, this.ly - 0.9, '大鸡腿!', '#FF9800');
    }
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      game.resultStats.bossesKilled++;
      const reward = this.level * 20;
      game.gold += reward;
      game.resultStats.goldEarned += reward;
      addFloatText(this.lx, this.ly - 0.6, '击杀!', '#FFD700');
      addFloatText(this.lx, this.ly - 1.0, '+' + reward + '金', '#FFD700');
      game._winPending = true; // 击杀任意猛鬼即获胜
      return;
    }
    // 非致死且低于30%：撤退回血（简单难度不撤退）
    if (this.lv.healCD > 0 && this.state !== 'retreat' && this.state !== 'heal'
        && this.hp / this.maxHp < 0.3) {
      this.state = 'retreat';
      addFloatText(this.lx, this.ly - 0.8, 'Boss撤退!', '#FF9800');
      if (hasSpecial('stunCharm')) {
        this.stunTimer = 2;
        addFloatText(this.lx, this.ly - 1.2, '定身!', '#9C27B0');
      }
    }
  }
}

/** 弹道（逻辑坐标，格/秒） */
class Projectile {
  constructor(lx, ly, target, damage) {
    this.lx = lx;
    this.ly = ly;
    this.target = target;
    this.damage = damage;
    this.speed = 6; // 格/秒
    this.dead = false;
  }
  update(dt) {
    if (this.dead || !this.target || this.target.dead) {
      this.dead = true;
      return;
    }
    const dx = this.target.lx - this.lx;
    const dy = this.target.ly - this.ly;
    const d = Math.hypot(dx, dy);
    if (d < 0.15) {
      this.target.takeDamage(this.damage);
      this.dead = true;
      return;
    }
    this.lx += (dx / d) * this.speed * dt;
    this.ly += (dy / d) * this.speed * dt;
  }
}

/** 飘字（逻辑坐标） */
class FloatText {
  constructor(lx, ly, text, color) {
    this.lx = lx;
    this.ly = ly;
    this.text = text;
    this.color = color;
    this.life = 1.0;
  }
  update(dt) {
    this.ly -= 0.5 * dt;
    this.life -= dt * 1.2;
  }
}

/** 粒子（逻辑坐标，格/秒） */
class Particle {
  constructor(lx, ly, color) {
    this.lx = lx;
    this.ly = ly;
    this.vx = randRange(-0.5, 0.5);
    this.vy = randRange(-0.8, 0.2);
    this.life = randRange(0.3, 0.8);
    this.color = color;
    this.size = randRange(2, 5);
  }
  update(dt) {
    this.lx += this.vx * dt;
    this.ly += this.vy * dt;
    this.vy += 1.2 * dt;
    this.life -= dt;
  }
}

// ========== 网格与坐标（统一逻辑坐标系：单位=格） ==========

/** 底部建造面板布局（窄屏自动两行，触控热区≥44px） */
function buildPanelLayout() {
  const gap = 6;
  const count = 8;
  const cols = game.W >= count * 62 + (count + 1) * gap ? 8 : 4;
  const rows = Math.ceil(count / cols);
  const btnW = Math.min(78 * game.scale, (game.W - gap * (cols + 1)) / cols);
  const btnH = Math.max(44, Math.min(btnW, 64 * game.scale));
  const panelH = rows * (btnH + gap) + gap + 4;
  return { cols, rows, btnW, btnH, gap, panelH };
}

/** 计算游戏区域参数 */
function getGameArea() {
  const W = game.W;
  const H = game.H;
  const layout = buildPanelLayout();
  const topBar = Math.max(40, 46 * game.scale);
  const bottomBar = layout.panelH + 12;
  const areaW = Math.min(W * 0.92, 760 * game.scale);
  const areaH = Math.max(120, H - topBar - bottomBar - 8);
  const areaX = (W - areaW) / 2;
  const areaY = topBar + 4;
  return { areaX, areaY, areaW, areaH, topBar, bottomBar };
}

function cellSize() {
  const area = getGameArea();
  return { cw: area.areaW / CONFIG.GRID_COLS, ch: area.areaH / CONFIG.GRID_ROWS };
}

/** 逻辑坐标(格) -> 屏幕坐标 */
function w2s(lx, ly) {
  const area = getGameArea();
  const s = cellSize();
  return { x: area.areaX + lx * s.cw, y: area.areaY + ly * s.ch };
}

/** 屏幕坐标 -> 逻辑坐标(格) */
function s2w(px, py) {
  const area = getGameArea();
  const s = cellSize();
  return { lx: (px - area.areaX) / s.cw, ly: (py - area.areaY) / s.ch };
}

/** 像素坐标转网格（越界返回null） */
function posToGrid(px, py) {
  const w = s2w(px, py);
  const col = Math.floor(w.lx);
  const row = Math.floor(w.ly);
  if (col < 0 || col >= CONFIG.GRID_COLS || row < 0 || row >= CONFIG.GRID_ROWS) return null;
  return { col, row };
}

function addFloatText(lx, ly, text, color) {
  if (game.floatTexts.length > 60) game.floatTexts.shift();
  game.floatTexts.push(new FloatText(lx, ly, text, color));
}

function addParticles(lx, ly, color, count) {
  if (game.particles.length > 300) return;
  for (let i = 0; i < count; i++) {
    game.particles.push(new Particle(lx, ly, color));
  }
}

// ========== 建筑统一操作（建造/升级/拆除/费用） ==========

/** 是否已拥有某特殊建筑 */
function hasSpecial(key) {
  return game.buildings.some((b) => b.type === 'special' && b.specialKey === key);
}

/** 当前最高发电机等级 */
function maxGenLevel() {
  let m = 0;
  for (const b of game.buildings) {
    if (b.type === 'generator') m = Math.max(m, b.level);
  }
  return m;
}

/** 某炮台等级所需的发电机等级 */
function genReqForTower(towerLevel) {
  if (towerLevel >= 12) return 5;
  if (towerLevel >= 10) return 4;
  if (towerLevel >= 8) return 3;
  if (towerLevel >= 6) return 2;
  if (towerLevel >= 4) return 1;
  return 0;
}

/** 修复台数量 */
function repairCount() {
  return game.buildings.filter((b) => b.type === 'repair').length;
}

/** 是否有可放置的空格 */
function hasEmptyCell() {
  for (const key of game.cells) {
    const [c, r] = key.split(',').map(Number);
    if (!game.grid[r][c]) return true;
  }
  return false;
}

/** 格子是否可建造（白名单 + 空位） */
function canPlaceAt(col, row) {
  if (!game.cells.has(col + ',' + row)) return false;
  if (game.grid[row] && game.grid[row][col]) return false;
  return true;
}

function costText(cost) {
  const parts = [];
  if (cost.gold) parts.push(formatRes(cost.gold) + '金');
  if (cost.energy) parts.push(formatRes(cost.energy) + '能');
  return parts.length ? parts.join('+') : '免费';
}

/** 统一扣款：失败给出具体原因（返回true/false） */
function payCost(cost, lx, ly) {
  if (cost.gold && game.gold < cost.gold) {
    addFloatText(lx, ly, '金币不足(需' + formatRes(cost.gold) + ')', '#F44336');
    return false;
  }
  if (cost.energy && game.power < cost.energy) {
    addFloatText(lx, ly, '能量不足(需' + formatRes(cost.energy) + ')', '#F44336');
    return false;
  }
  game.gold -= cost.gold || 0;
  game.power -= cost.energy || 0;
  return true;
}

/** 拆除返还：累计投入的25% */
function refundOf(b) {
  return {
    gold: Math.floor((b.investedGold || 0) * CONFIG.REFUND_RATE),
    energy: Math.floor((b.investedEnergy || 0) * CONFIG.REFUND_RATE),
  };
}

function refundText(r) {
  const parts = [];
  if (r.gold) parts.push('+' + formatRes(r.gold) + '金');
  if (r.energy) parts.push('+' + formatRes(r.energy) + '能');
  return parts.length ? parts.join(' ') : '无返还';
}

/** 下一级数据（无则null） */
function nextLevelData(b) {
  switch (b.type) {
    case 'bed': return b.level < CONFIG.BED_DATA.length ? CONFIG.BED_DATA[b.level] : null;
    case 'door': return b.level < CONFIG.DOOR_DATA.length ? CONFIG.DOOR_DATA[b.level] : null;
    case 'tower': return b.level < CONFIG.TOWER_DATA.length ? CONFIG.TOWER_DATA[b.level] : null;
    case 'generator': return b.level < CONFIG.GENERATOR_DATA.length ? CONFIG.GENERATOR_DATA[b.level] : null;
    case 'repair': return b.level < CONFIG.REPAIR_DATA.length ? CONFIG.REPAIR_DATA[b.level] : null;
    default: return null;
  }
}

function nextCostOf(b) {
  const next = nextLevelData(b);
  if (!next) return null;
  return { gold: next.gold || 0, energy: next.energy || 0 };
}

/** 升级前置检查 */
function prereqCheck(b) {
  const next = nextLevelData(b);
  if (!next) return { ok: true };
  if (b.type === 'bed' && next.door) {
    if (!game.door || game.door.level < next.door) {
      return { ok: false, msg: '需' + next.door + '级门' };
    }
  }
  if (b.type === 'tower' && next.gen) {
    if (maxGenLevel() < next.gen) {
      return { ok: false, msg: '需' + next.gen + '级发电机' };
    }
  }
  return { ok: true };
}

/** 统一升级入口 */
function tryUpgradeBuilding(b) {
  if (game.state !== STATE.PLAYING) return;
  const lx = b.col + 0.5;
  const ly = b.row + 0.2;
  const next = nextLevelData(b);
  if (!next) {
    const msg = (b.type === 'mine' || b.type === 'special') ? '该建筑不可升级' : '已满级';
    addFloatText(lx, ly, msg, '#9E9E9E');
    return;
  }
  const prereq = prereqCheck(b);
  if (!prereq.ok) {
    addFloatText(lx, ly, prereq.msg, '#FF9800');
    return;
  }
  const cost = nextCostOf(b);
  if (!payCost(cost, lx, ly)) return;
  b.investedGold += cost.gold;
  b.investedEnergy += cost.energy;
  b.level++;
  if (b.type === 'door') {
    b.maxHp = CONFIG.DOOR_DATA[b.level - 1].hp;
    b.hp = b.maxHp; // 升级回满
  }
  const names = { bed: '床', door: '大门', tower: '炮台', generator: '发电机', repair: '修复台' };
  addFloatText(lx, ly - 0.4, (names[b.type] || '建筑') + '升级!', '#4CAF50');
  addParticles(lx, ly, '#4CAF50', 6);
  game.sfx.upgrade();
}

/** 统一拆除入口（带前置保护） */
function tryDemolish(b) {
  if (game.state !== STATE.PLAYING) return;
  if (b.type === 'bed' || b.type === 'door') return;
  const lx = b.col + 0.5;
  const ly = b.row + 0.2;
  if (b.type === 'generator') {
    // 保护现有炮台的前置
    let maxGen = 0;
    for (const g of game.buildings) {
      if (g.type === 'generator' && g !== b) maxGen = Math.max(maxGen, g.level);
    }
    let need = 0;
    for (const t of game.buildings) {
      if (t.type === 'tower') need = Math.max(need, genReqForTower(t.level));
    }
    if (need > maxGen) {
      addFloatText(lx, ly, '有炮台依赖此发电机，无法拆除', '#F44336');
      return;
    }
  }
  const r = refundOf(b);
  game.gold += r.gold;
  game.power += r.energy;
  game.buildings = game.buildings.filter((x) => x !== b);
  if (game.grid[b.row] && game.grid[b.row][b.col] === b) game.grid[b.row][b.col] = null;
  if (game.ui.infoPopup === b) game.ui.infoPopup = null;
  game.ui.demolishConfirm = null;
  addFloatText(lx, ly, '拆除 ' + refundText(r), '#FF9800');
  game.sfx.build();
}

/** 统一建造入口 */
function placeBuilding(type, col, row) {
  if (game.state !== STATE.PLAYING) return false;
  const lx = col + 0.5;
  const ly = row + 0.5;
  if (!game.cells.has(col + ',' + row)) {
    addFloatText(lx, ly, '此处不可建造', '#F44336');
    return false;
  }
  if (game.grid[row][col]) {
    addFloatText(lx, ly, '位置已被占用', '#F44336');
    return false;
  }

  let building = null;
  let cost = { gold: 0, energy: 0 };
  let keepSelection = true;

  if (type === 'tower') {
    cost = { gold: CONFIG.TOWER_DATA[0].gold };
    building = new Tower(col, row);
  } else if (type === 'generator') {
    cost = { gold: CONFIG.GENERATOR_DATA[0].gold };
    building = new Generator(col, row);
  } else if (type.startsWith('mine_')) {
    const idx = parseInt(type.split('_')[1], 10);
    cost = { energy: CONFIG.MINE_DATA[idx].energy };
    building = new Mine(col, row, idx);
  } else if (type === 'repair') {
    if (repairCount() >= CONFIG.REPAIR_LIMIT) {
      addFloatText(lx, ly, '修复台已达上限(' + CONFIG.REPAIR_LIMIT + '台)', '#F44336');
      return false;
    }
    cost = { energy: CONFIG.REPAIR_DATA[0].energy };
    building = new RepairStation(col, row);
  } else if (type.startsWith('special_')) {
    const key = type.slice(8);
    if (hasSpecial(key)) {
      addFloatText(lx, ly, '每种特殊建筑仅限1个', '#F44336');
      return false;
    }
    cost = { energy: CONFIG.SPECIALS[key].energy };
    building = new SpecialBuilding(col, row, key);
    keepSelection = false; // 特殊建筑放完退出放置模式
  } else {
    return false;
  }

  if (!payCost(cost, lx, ly)) return false;

  building.investedGold = cost.gold || 0;
  building.investedEnergy = cost.energy || 0;
  game.buildings.push(building);
  game.grid[row][col] = building;
  game.sfx.build();
  addFloatText(lx, ly - 0.3, '建造完成!', '#4CAF50');
  addParticles(lx, ly, '#4CAF50', 8);
  if (!keepSelection) {
    game.ui.selectedBuildType = null;
    game.ui.hoverCell = null;
  }
  return true;
}

// ========== 渲染系统 ==========

function drawRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawHPBar(ctx, x, y, w, ratio, color) {
  const h = Math.max(4, 5 * game.scale);
  ctx.fillStyle = '#333';
  ctx.fillRect(x - w / 2, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x - w / 2, y, w * clamp(ratio, 0, 1), h);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - w / 2, y, w, h);
}

/** 矢量兜底图形（素材缺失时使用） */
function drawFallbackBuilding(ctx, type, x, y, w, h, label) {
  const colors = {
    bed: '#8D6E63', door: '#795548', tower: '#607D8B', generator: '#FFC107',
    mine: '#FF9800', repair: '#4CAF50', special: '#9C27B0',
  };
  ctx.fillStyle = colors[type] || '#666';
  drawRoundRect(ctx, x - w / 2, y - h / 2, w, h, 4);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.max(10, Math.floor(11 * game.scale))}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y);
}

/** 渲染主菜单 */
function renderMenu(ctx) {
  const W = game.W, H = game.H;
  const bg = IMG.ui_MENU_BG;
  if (bg) {
    ctx.drawImage(bg, 0, 0, W, H);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0d0d1a');
    grad.addColorStop(1, '#1a0a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, W, H);

  if (game.flickerAlpha > 0) {
    ctx.fillStyle = `rgba(200,200,255,${game.flickerAlpha * 0.05})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (game.ghostAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = game.ghostAlpha * 0.3;
    ctx.fillStyle = '#aaa';
    ctx.beginPath();
    ctx.arc(game.ghostLx * W, game.ghostLy * H, 30 * game.scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 标题
  const titleY = H * 0.25;
  ctx.save();
  ctx.shadowColor = '#ff1744';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#e0e0e0';
  ctx.font = `bold ${Math.max(28, Math.floor(48 * game.scale))}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('猛鬼宿舍', W / 2, titleY);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#9e9e9e';
  ctx.font = `${Math.max(12, Math.floor(18 * game.scale))}px Microsoft YaHei`;
  ctx.fillText('微恐塔防', W / 2, titleY + 40 * game.scale);
  ctx.restore();

  // 开始按钮
  const btnW = 200 * game.scale;
  const btnH = 60 * game.scale;
  const btnX = W / 2 - btnW / 2;
  const btnY = H * 0.55;
  if (IMG.ui_START_BTN) {
    ctx.drawImage(IMG.ui_START_BTN, btnX, btnY, btnW, btnH);
  } else {
    ctx.fillStyle = '#c62828';
    drawRoundRect(ctx, btnX, btnY, btnW, btnH, 8);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(14, Math.floor(22 * game.scale))}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('开始游戏', W / 2, btnY + btnH / 2);
  }
  game._menuBtn = { x: btnX, y: btnY, w: btnW, h: btnH };

  // 货币框（仅装饰）
  const coinFrameW = 160 * game.scale;
  const coinFrameH = 36 * game.scale;
  const coinFrameX = W / 2 - coinFrameW / 2;
  const coinFrameY = H * 0.72;
  if (IMG.ui_COIN_FRAME) {
    ctx.drawImage(IMG.ui_COIN_FRAME, coinFrameX, coinFrameY, coinFrameW, coinFrameH);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    drawRoundRect(ctx, coinFrameX, coinFrameY, coinFrameW, coinFrameH, 6);
    ctx.fill();
  }
  ctx.fillStyle = '#FFD700';
  ctx.font = `${Math.max(11, Math.floor(16 * game.scale))}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💰 ' + formatRes(game.gold), W / 2, coinFrameY + coinFrameH / 2);
}

/** 渲染角色选择 */
function renderSelectChar(ctx) {
  const W = game.W, H = game.H;
  if (IMG.ui_SELECT_BG) {
    ctx.drawImage(IMG.ui_SELECT_BG, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#e0e0e0';
  ctx.font = `bold ${Math.max(18, Math.floor(28 * game.scale))}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('选择角色', W / 2, H * 0.15);

  const cardW = 140 * game.scale;
  const cardH = 200 * game.scale;
  const gap = 40 * game.scale;
  const totalW = cardW * 2 + gap;
  const startX = W / 2 - totalW / 2;
  const cardY = H * 0.3;

  const cards = [
    { key: 'male', label: '男性角色', color: '#2196F3', fill: 'rgba(33,150,243,0.3)', icon: '🧑', x: startX },
    { key: 'female', label: '女性角色', color: '#E91E63', fill: 'rgba(233,30,99,0.3)', icon: '👩', x: startX + cardW + gap },
  ];
  for (const c of cards) {
    const selected = game.charGender === c.key;
    ctx.fillStyle = selected ? c.fill : 'rgba(255,255,255,0.1)';
    drawRoundRect(ctx, c.x, cardY, cardW, cardH, 10);
    ctx.fill();
    ctx.strokeStyle = selected ? c.color : '#555';
    ctx.lineWidth = selected ? 3 : 1;
    ctx.stroke();
    ctx.font = `${Math.max(32, Math.floor(60 * game.scale))}px Microsoft YaHei`;
    ctx.fillText(c.icon, c.x + cardW / 2, cardY + cardH * 0.4);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(13, Math.floor(18 * game.scale))}px Microsoft YaHei`;
    ctx.fillText(c.label, c.x + cardW / 2, cardY + cardH * 0.75);
  }

  const confirmBtnW = 160 * game.scale;
  const confirmBtnH = 50 * game.scale;
  const confirmBtnX = W / 2 - confirmBtnW / 2;
  const confirmBtnY = H * 0.78;
  ctx.fillStyle = '#4CAF50';
  drawRoundRect(ctx, confirmBtnX, confirmBtnY, confirmBtnW, confirmBtnH, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(14, Math.floor(20 * game.scale))}px Microsoft YaHei`;
  ctx.fillText('确认选择', W / 2, confirmBtnY + confirmBtnH / 2);

  game._charAreas = {
    male: { x: startX, y: cardY, w: cardW, h: cardH },
    female: { x: startX + cardW + gap, y: cardY, w: cardW, h: cardH },
    confirm: { x: confirmBtnX, y: confirmBtnY, w: confirmBtnW, h: confirmBtnH },
  };
}

/** 渲染关卡选择 */
function renderSelectLevel(ctx) {
  const W = game.W, H = game.H;
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#e0e0e0';
  ctx.font = `bold ${Math.max(18, Math.floor(28 * game.scale))}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('选择关卡', W / 2, H * 0.12);

  const cardW = Math.min(200 * game.scale, W * 0.3);
  const cardH = 240 * game.scale;
  const gap = 20 * game.scale;
  const totalW = cardW * 3 + gap * 2;
  const startX = W / 2 - totalW / 2;
  const cardY = H * 0.22;

  game._levelAreas = [];
  CONFIG.LEVELS.forEach((level, i) => {
    const x = startX + i * (cardW + gap);
    const selected = game.levelIndex === i;
    ctx.fillStyle = selected ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.05)';
    drawRoundRect(ctx, x, cardY, cardW, cardH, 10);
    ctx.fill();
    ctx.strokeStyle = selected ? level.color : '#444';
    ctx.lineWidth = selected ? 3 : 1;
    ctx.stroke();

    const roomImg = IMG['room_' + i];
    if (roomImg) {
      ctx.drawImage(roomImg, x + 10, cardY + 10, cardW - 20, cardH * 0.5);
    } else {
      ctx.fillStyle = '#222';
      ctx.fillRect(x + 10, cardY + 10, cardW - 20, cardH * 0.5);
    }

    ctx.fillStyle = level.color;
    ctx.font = `bold ${Math.max(14, Math.floor(20 * game.scale))}px Microsoft YaHei`;
    ctx.fillText(level.name + ' · ' + (i === 0 ? '幽灵船' : i === 1 ? '废弃医院' : '末日堡垒'), x + cardW / 2, cardY + cardH * 0.68);
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.max(11, Math.floor(13 * game.scale))}px Microsoft YaHei`;
    ctx.fillText(level.bossName + ' Lv.' + level.bossData[0].level, x + cardW / 2, cardY + cardH * 0.8);
    ctx.fillText('可建塔位: ' + level.cells.length + '个', x + cardW / 2, cardY + cardH * 0.9);

    game._levelAreas.push({ x, y: cardY, w: cardW, h: cardH, index: i });
  });

  const btnW = 180 * game.scale;
  const btnH = 50 * game.scale;
  const btnX = W / 2 - btnW / 2;
  const btnY = H * 0.82;
  ctx.fillStyle = '#c62828';
  drawRoundRect(ctx, btnX, btnY, btnW, btnH, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(14, Math.floor(20 * game.scale))}px Microsoft YaHei`;
  ctx.fillText('进入战斗', btnX + btnW / 2, btnY + btnH / 2);
  game._levelStartBtn = { x: btnX, y: btnY, w: btnW, h: btnH };
}

/** 渲染游戏主界面 */
function renderPlaying(ctx) {
  const W = game.W, H = game.H;
  const area = getGameArea();
  const s = cellSize();

  let shakeX = 0, shakeY = 0;
  if (game.shakeTimer > 0) {
    shakeX = (Math.random() - 0.5) * game.shakeAmount * 2;
    shakeY = (Math.random() - 0.5) * game.shakeAmount * 2;
  }
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // 房间背景
  const roomImg = IMG['room_' + game.levelIndex];
  if (roomImg) {
    ctx.drawImage(roomImg, area.areaX, area.areaY, area.areaW, area.areaH);
  } else {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(area.areaX, area.areaY, area.areaW, area.areaH);
  }
  ctx.fillStyle = 'rgba(0,0,10,0.35)';
  ctx.fillRect(area.areaX, area.areaY, area.areaW, area.areaH);

  // 微弱灯光
  const lightX = area.areaX + area.areaW * 0.5;
  const lightY = area.areaY + area.areaH * 0.3;
  const lightR = 200 * game.scale;
  const lightGrad = ctx.createRadialGradient(lightX, lightY, 0, lightX, lightY, lightR);
  lightGrad.addColorStop(0, 'rgba(255,240,200,0.08)');
  lightGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lightGrad;
  ctx.fillRect(area.areaX, area.areaY, area.areaW, area.areaH);

  if (game.flickerAlpha > 0) {
    ctx.fillStyle = `rgba(200,200,255,${game.flickerAlpha * 0.03})`;
    ctx.fillRect(area.areaX, area.areaY, area.areaW, area.areaH);
  }

  // 网格线
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let c = 0; c <= CONFIG.GRID_COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(area.areaX + c * s.cw, area.areaY);
    ctx.lineTo(area.areaX + c * s.cw, area.areaY + area.areaH);
    ctx.stroke();
  }
  for (let r = 0; r <= CONFIG.GRID_ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(area.areaX, area.areaY + r * s.ch);
    ctx.lineTo(area.areaX + area.areaW, area.areaY + r * s.ch);
    ctx.stroke();
  }

  // 建造模式：高亮可建造格 + 悬停预览
  if (game.ui.selectedBuildType) {
    for (const key of game.cells) {
      const [c, r] = key.split(',').map(Number);
      const empty = !game.grid[r][c];
      ctx.fillStyle = empty ? 'rgba(76,175,80,0.18)' : 'rgba(244,67,54,0.15)';
      ctx.fillRect(area.areaX + c * s.cw, area.areaY + r * s.ch, s.cw, s.ch);
    }
    if (game.ui.hoverCell) {
      const { col, row } = game.ui.hoverCell;
      const ok = canPlaceAt(col, row);
      ctx.fillStyle = ok ? 'rgba(76,175,80,0.4)' : 'rgba(244,67,54,0.4)';
      ctx.fillRect(area.areaX + col * s.cw, area.areaY + row * s.ch, s.cw, s.ch);
    }
  }

  // 门
  renderDoor(ctx, s);
  // 建筑
  for (const b of game.buildings) renderBuilding(ctx, b, s);
  // 玩家
  renderPlayer(ctx, s);
  // Boss
  for (const boss of game.bosses) renderBoss(ctx, boss);

  // 弹道
  for (const p of game.projectiles) {
    if (p.dead) continue;
    const pt = w2s(p.lx, p.ly);
    ctx.fillStyle = 'rgba(255,215,0,0.3)';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, Math.max(3, 5 * game.scale), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, Math.max(2, 3 * game.scale), 0, Math.PI * 2);
    ctx.fill();
  }

  // 炮台攻击范围（弹窗打开时）
  for (const b of game.buildings) {
    if (b.type === 'tower' && game.ui.infoPopup === b) {
      const c = w2s(b.col + 0.5, b.row + 0.5);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(c.x, c.y, b.rangeCells * s.cw, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // 飘字
  for (const ft of game.floatTexts) {
    if (ft.life <= 0) continue;
    const pt = w2s(ft.lx, ft.ly);
    ctx.save();
    ctx.globalAlpha = clamp(ft.life, 0, 1);
    ctx.fillStyle = ft.color;
    ctx.font = `bold ${Math.max(11, Math.floor(14 * game.scale))}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ft.text, pt.x, pt.y);
    ctx.restore();
  }

  // 粒子
  for (const p of game.particles) {
    if (p.life <= 0) continue;
    const pt = w2s(p.lx, p.ly);
    ctx.save();
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, p.size * game.scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 幽灵影子
  if (game.ghostAlpha > 0) {
    const pt = w2s(game.ghostLx, game.ghostLy);
    ctx.save();
    ctx.globalAlpha = game.ghostAlpha * 0.15;
    ctx.fillStyle = '#ccc';
    ctx.beginPath();
    ctx.ellipse(pt.x, pt.y, 20 * game.scale, 30 * game.scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore(); // 结束震动偏移

  renderTopBar(ctx);
  renderBuildPanel(ctx);

  if (game.ui.infoPopup) renderInfoPopup(ctx);
  if (game.ui.shopOpen) renderShopPopup(ctx);

  // 首只Boss倒计时
  if (game.gameTime < CONFIG.FIRST_BOSS_TIME) {
    const remaining = Math.ceil(CONFIG.FIRST_BOSS_TIME - game.gameTime);
    const bw = 200 * game.scale;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W / 2 - bw / 2, H * 0.45, bw, 40 * game.scale);
    ctx.fillStyle = '#FFD700';
    ctx.font = `bold ${Math.max(14, Math.floor(20 * game.scale))}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`猛鬼来袭: ${remaining}s`, W / 2, H * 0.45 + 20 * game.scale);
  } else if (game.gameTime < 75) {
    // 胜利条件提示
    const bw = 280 * game.scale;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(W / 2 - bw / 2, H * 0.45, bw, 30 * game.scale);
    ctx.fillStyle = '#FFD700';
    ctx.font = `${Math.max(10, Math.floor(12 * game.scale))}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('提示：击杀任意猛鬼即可获胜！', W / 2, H * 0.45 + 15 * game.scale);
  }
}

/** 渲染门 */
function renderDoor(ctx, s) {
  const door = game.door;
  if (!door) return;
  const pt = w2s(door.col + 0.5, door.row + 0.5);
  const w = s.cw * 0.8;
  const h = s.ch * 0.85;
  const doorImg = IMG['door_' + door.level];
  if (doorImg) {
    ctx.drawImage(doorImg, pt.x - w / 2, pt.y - h / 2, w, h);
  } else {
    drawFallbackBuilding(ctx, 'door', pt.x, pt.y, w, h, '门Lv' + door.level);
  }
  if (door.invincible) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0,188,212,0.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, Math.max(w, h) * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  drawHPBar(ctx, pt.x, pt.y - h / 2 - 10 * game.scale, w, door.hp / door.maxHp, '#4CAF50');
}

/** 渲染建筑 */
function renderBuilding(ctx, b, s) {
  const pt = w2s(b.col + 0.5, b.row + 0.5);
  const w = s.cw * 0.75;
  const h = s.ch * 0.75;
  const labelFont = Math.max(9, Math.floor(10 * game.scale));

  switch (b.type) {
    case 'bed': {
      const bedImg = IMG['bed_' + b.level];
      if (bedImg) {
        ctx.drawImage(bedImg, pt.x - w / 2, pt.y - h / 2, w, h);
      } else {
        drawFallbackBuilding(ctx, 'bed', pt.x, pt.y, w, h, '床Lv' + b.level);
      }
      ctx.fillStyle = '#FFD700';
      ctx.font = `${labelFont}px Microsoft YaHei`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+' + b.income + '/s', pt.x, pt.y + h / 2 + 12 * game.scale);
      break;
    }
    case 'tower': {
      const towerImg = IMG['tower_' + b.level]; // 等级外观，稳定显示
      if (towerImg) {
        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(b.angle);
        ctx.drawImage(towerImg, -w / 2, -h / 2, w, h);
        ctx.restore();
      } else {
        drawFallbackBuilding(ctx, 'tower', pt.x, pt.y, w, h, '炮Lv' + b.level);
      }
      break;
    }
    case 'generator': {
      const genImg = IMG['gen_' + b.level];
      if (genImg) {
        ctx.drawImage(genImg, pt.x - w / 2, pt.y - h / 2, w, h);
      } else {
        drawFallbackBuilding(ctx, 'generator', pt.x, pt.y, w, h, '电Lv' + b.level);
      }
      ctx.fillStyle = '#FFC107';
      ctx.font = `${labelFont}px Microsoft YaHei`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+' + formatRes(b.output) + '电/s', pt.x, pt.y + h / 2 + 12 * game.scale);
      break;
    }
    case 'mine': {
      drawFallbackBuilding(ctx, 'mine', pt.x, pt.y, w, h, b.mineName);
      ctx.fillStyle = '#FF9800';
      ctx.font = `${labelFont}px Microsoft YaHei`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+' + b.income + '金/s', pt.x, pt.y + h / 2 + 12 * game.scale);
      break;
    }
    case 'repair': {
      const repairImg = IMG['repair_' + b.level];
      if (repairImg) {
        ctx.drawImage(repairImg, pt.x - w / 2, pt.y - h / 2, w, h);
      } else {
        drawFallbackBuilding(ctx, 'repair', pt.x, pt.y, w, h, '修Lv' + b.level);
      }
      ctx.fillStyle = '#4CAF50';
      ctx.font = `${labelFont}px Microsoft YaHei`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.pct + '%/s', pt.x, pt.y + h / 2 + 12 * game.scale);
      break;
    }
    case 'special': {
      drawFallbackBuilding(ctx, 'special', pt.x, pt.y, w, h, b.specialName);
      break;
    }
  }
}

/** 渲染玩家 */
function renderPlayer(ctx, s) {
  if (!game.player) return;
  const p = game.player;
  const pt = w2s(p.col + 0.5, p.row + 0.5);
  const w = s.cw * 0.6;
  const h = s.ch * 0.8;
  const isMale = game.charGender === 'male';
  const frames = isMale ? [0, 1, 2, 4, 5, 7] : [0, 1, 2, 3, 4, 5];
  const frame = frames[Math.floor(game.animTimer * 4) % frames.length];
  const stateKey = p.inBed ? 'sleep' : 'stand';
  const imgKey = `player_${isMale ? 'm' : 'f'}_${stateKey}_${frame}`;
  const img = IMG[imgKey];

  if (p.inBed) {
    const zOffset = Math.sin(game.gameTime * 3) * 5;
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(11, Math.floor(14 * game.scale))}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💤', pt.x + 15 * game.scale, pt.y - h / 2 + zOffset);
  }

  if (img) {
    ctx.drawImage(img, pt.x - w / 2, pt.y - h / 2, w, h);
  } else {
    ctx.fillStyle = isMale ? '#64B5F6' : '#F48FB1';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, w * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(10, Math.floor(12 * game.scale))}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isMale ? '🧑' : '👩', pt.x, pt.y);
  }
}

/** 渲染Boss */
function renderBoss(ctx, boss) {
  if (boss.dead) return;
  const pt = w2s(boss.lx, boss.ly);
  const size = Math.max(30, 52 * game.scale);
  const isBig = boss.level >= 4;
  const isAttacking = boss.isAttacking && (boss.atkAnimTimer % 0.6 < 0.3);
  const frame = Math.floor(boss.animTimer * 3) % 3;
  const imgKey = `boss_${isBig ? 'big' : 'small'}_${isAttacking ? 'atk' : 'idle'}_${frame}`;
  const img = IMG[imgKey];

  if (img) {
    ctx.drawImage(img, pt.x - size, pt.y - size, size * 2, size * 2);
  } else {
    ctx.fillStyle = boss.state === 'retreat' ? '#FF5722' : '#c62828';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, size * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(12, Math.floor(16 * game.scale))}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('👻', pt.x, pt.y);
  }

  if (boss.stunTimer > 0) {
    ctx.strokeStyle = '#9C27B0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, size * 0.7, 0, Math.PI * 2);
    ctx.stroke();
  }

  const infoY = pt.y - size - 15 * game.scale;
  if (boss.state === 'retreat') {
    ctx.fillStyle = '#FF9800';
    ctx.font = `bold ${Math.max(10, Math.floor(12 * game.scale))}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('撤退中!', pt.x, infoY + 14 * game.scale);
  } else if (boss.state === 'heal') {
    ctx.fillStyle = '#4CAF50';
    ctx.font = `bold ${Math.max(10, Math.floor(12 * game.scale))}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('回血中 ' + Math.ceil(boss.healTimer) + 's', pt.x, infoY + 14 * game.scale);
  }

  const hpRatio = boss.hp / boss.maxHp;
  const hpColor = hpRatio > 0.5 ? '#F44336' : (hpRatio > 0.3 ? '#FF9800' : '#FFEB3B');
  drawHPBar(ctx, pt.x, pt.y - size - 8 * game.scale, size * 1.5, hpRatio, hpColor);

  ctx.fillStyle = '#fff';
  ctx.font = `${Math.max(9, Math.floor(10 * game.scale))}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('Lv.' + boss.level, pt.x, infoY);
}

/** 渲染顶部资源栏 */
function renderTopBar(ctx) {
  const W = game.W;
  const area = getGameArea();
  const barH = area.topBar;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, barH);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, barH);
  ctx.lineTo(W, barH);
  ctx.stroke();

  const y = barH / 2;
  const fontSize = Math.max(12, Math.floor(15 * game.scale));
  ctx.textBaseline = 'middle';
  ctx.font = `${fontSize}px Microsoft YaHei`;

  // 金币
  ctx.fillStyle = '#FFD700';
  ctx.textAlign = 'left';
  ctx.fillText('💰 ' + formatRes(game.gold), 12, y);

  // 能量
  ctx.fillStyle = '#00BCD4';
  ctx.fillText('⚡ ' + formatRes(game.power), 14 + fontSize * 5.2, y);

  // 时间
  ctx.fillStyle = '#aaa';
  ctx.textAlign = 'center';
  const mins = Math.floor(game.gameTime / 60);
  const secs = Math.floor(game.gameTime % 60);
  ctx.fillText(`${mins}:${secs.toString().padStart(2, '0')}`, W / 2, y);

  // Boss倒计时与存活数
  ctx.textAlign = 'right';
  let rightX = W - 96;
  if (game.gameTime >= CONFIG.FIRST_BOSS_TIME) {
    ctx.fillStyle = '#F44336';
    ctx.fillText('👻' + Math.ceil(game.bossSpawnTimer) + 's', rightX, y);
    rightX -= fontSize * 4;
  }
  const alive = game.bosses.filter((b) => !b.dead).length;
  if (alive > 0) {
    ctx.fillStyle = '#FF9800';
    ctx.fillText('x' + alive, rightX, y);
  }

  // 静音按钮
  const btnSize = Math.min(34, barH - 8);
  const muteX = W - btnSize - 8;
  const muteY = (barH - btnSize) / 2;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  drawRoundRect(ctx, muteX, muteY, btnSize, btnSize, 6);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.floor(btnSize * 0.55)}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.fillText(game.muted ? '🔇' : '🔊', muteX + btnSize / 2, muteY + btnSize / 2);
  game._muteBtn = { x: muteX, y: muteY, w: btnSize, h: btnSize };

  // 暂停按钮
  const pauseX = muteX - btnSize - 8;
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  drawRoundRect(ctx, pauseX, muteY, btnSize, btnSize, 6);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText('⏸', pauseX + btnSize / 2, muteY + btnSize / 2);
  game._pauseBtn = { x: pauseX, y: muteY, w: btnSize, h: btnSize };
}

/** 渲染底部建造面板（窄屏两行，热区≥44px） */
function renderBuildPanel(ctx) {
  const W = game.W;
  const layout = buildPanelLayout();
  const panelY = game.H - layout.panelH - 6;

  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, panelY, W, layout.panelH);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, panelY);
  ctx.lineTo(W, panelY);
  ctx.stroke();

  const items = [
    { type: 'tower', label: '炮台', sub: formatRes(CONFIG.TOWER_DATA[0].gold) + '金', color: '#607D8B', cost: { gold: CONFIG.TOWER_DATA[0].gold } },
    { type: 'generator', label: '发电机', sub: formatRes(CONFIG.GENERATOR_DATA[0].gold) + '金', color: '#FFC107', cost: { gold: CONFIG.GENERATOR_DATA[0].gold } },
    { type: 'mine_0', label: '铜矿', sub: formatRes(CONFIG.MINE_DATA[0].energy) + '能', color: '#FF9800', cost: { energy: CONFIG.MINE_DATA[0].energy } },
    { type: 'mine_1', label: '银矿', sub: formatRes(CONFIG.MINE_DATA[1].energy) + '能', color: '#FF9800', cost: { energy: CONFIG.MINE_DATA[1].energy } },
    { type: 'mine_2', label: '金矿', sub: formatRes(CONFIG.MINE_DATA[2].energy) + '能', color: '#FF9800', cost: { energy: CONFIG.MINE_DATA[2].energy } },
    { type: 'mine_3', label: '钻石矿', sub: formatRes(CONFIG.MINE_DATA[3].energy) + '能', color: '#FF9800', cost: { energy: CONFIG.MINE_DATA[3].energy } },
    { type: 'repair', label: '修复台', sub: formatRes(CONFIG.REPAIR_DATA[0].energy) + '能', color: '#4CAF50', cost: { energy: CONFIG.REPAIR_DATA[0].energy } },
    { type: 'shop', label: '特殊', sub: '电力', color: '#9C27B0', cost: null },
  ];

  game._buildBtns = [];
  const labelFont = Math.max(10, Math.floor(13 * game.scale));
  const subFont = Math.max(9, Math.floor(10 * game.scale));
  items.forEach((item, i) => {
    const col = i % layout.cols;
    const row = Math.floor(i / layout.cols);
    const x = layout.gap + col * (layout.btnW + layout.gap);
    const y = panelY + layout.gap + 2 + row * (layout.btnH + layout.gap);
    const isSelected = game.ui.selectedBuildType === item.type;

    const affordable = !item.cost || ((item.cost.gold || 0) <= game.gold && (item.cost.energy || 0) <= game.power);
    ctx.fillStyle = isSelected ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.05)';
    drawRoundRect(ctx, x, y, layout.btnW, layout.btnH, 6);
    ctx.fill();
    ctx.strokeStyle = isSelected ? '#fff' : item.color;
    ctx.lineWidth = isSelected ? 2 : 1;
    if (!affordable) ctx.globalAlpha = 0.55;
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.fillStyle = item.color;
    ctx.font = `bold ${labelFont}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.label, x + layout.btnW / 2, y + layout.btnH * 0.35);
    ctx.fillStyle = affordable ? '#aaa' : '#F44336';
    ctx.font = `${subFont}px Microsoft YaHei`;
    ctx.fillText(item.sub, x + layout.btnW / 2, y + layout.btnH * 0.7);

    game._buildBtns.push({ x, y, w: layout.btnW, h: layout.btnH, type: item.type });
  });

  // 提前出怪按钮（倒计时>3秒时可用）
  if (game.gameTime >= 0 && game.bossSpawnTimer > 3) {
    const bw = Math.min(120 * game.scale, 130);
    const bh = Math.max(28, 30 * game.scale);
    const bx = W - bw - 10;
    const by = panelY - bh - 8;
    ctx.fillStyle = 'rgba(198,40,40,0.85)';
    drawRoundRect(ctx, bx, by, bw, bh, bh / 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(11, Math.floor(13 * game.scale))}px Microsoft YaHei`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⏩提前出怪', bx + bw / 2, by + bh / 2);
    game._earlyBtn = { x: bx, y: by, w: bw, h: bh };
  } else {
    game._earlyBtn = null;
  }
}

/** 渲染建筑信息弹窗（床支持上下床+升级） */
function renderInfoPopup(ctx) {
  const b = game.ui.infoPopup;
  if (!b) return;
  const W = game.W, H = game.H;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, W, H);

  const isBed = b.type === 'bed';
  const popW = Math.min(320 * game.scale, W * 0.94);
  const popH = (isBed ? 268 : 224) * Math.max(0.9, game.scale);
  const popX = W / 2 - popW / 2;
  const popY = H / 2 - popH / 2;

  ctx.fillStyle = 'rgba(30,30,50,0.95)';
  drawRoundRect(ctx, popX, popY, popW, popH, 12);
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.stroke();

  const cx = W / 2;
  let ty = popY + 24 * game.scale;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const names = { bed: '床', door: '大门', tower: '炮台', generator: '发电机', mine: '矿场', repair: '修复台', special: '特殊建筑' };
  const name = b.type === 'special' ? b.specialName : (names[b.type] || '建筑');
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(14, Math.floor(18 * game.scale))}px Microsoft YaHei`;
  ctx.fillText(name + ' Lv.' + b.level, cx, ty);

  ty += 26 * game.scale;
  ctx.font = `${Math.max(11, Math.floor(13 * game.scale))}px Microsoft YaHei`;
  ctx.fillStyle = '#bbb';
  const lineH = 20 * Math.max(0.9, game.scale);

  if (b.type === 'bed') {
    ctx.fillText('金币产出: ' + b.income + '/秒' + (game.player && game.player.inBed ? '（睡觉中）' : '（未上床）'), cx, ty);
  } else if (b.type === 'door') {
    ctx.fillText('血量: ' + Math.floor(b.hp) + '/' + b.maxHp, cx, ty); ty += lineH;
    ctx.fillText('自愈: ' + b.regen + '/秒', cx, ty);
  } else if (b.type === 'tower') {
    ctx.fillText('攻击: ' + Math.floor(b.atk) + '  范围: ' + b.rangeCells.toFixed(1) + '格', cx, ty); ty += lineH;
    ctx.fillText('攻击间隔: ' + b.interval.toFixed(2) + '秒', cx, ty);
  } else if (b.type === 'generator') {
    ctx.fillText('能量产出: ' + formatRes(b.output) + '/秒', cx, ty);
  } else if (b.type === 'mine') {
    ctx.fillText('金币产出: ' + b.income + '/秒', cx, ty); ty += lineH;
    ctx.fillText('拆除返还: ' + formatRes(refundOf(b).energy) + '能量', cx, ty);
  } else if (b.type === 'repair') {
    ctx.fillText('维修: 每秒恢复门最大血量' + b.pct + '%', cx, ty);
  } else if (b.type === 'special') {
    ctx.fillText(CONFIG.SPECIALS[b.specialKey].desc, cx, ty);
  }

  // 前置提示
  ty += lineH + 6;
  const prereq = prereqCheck(b);
  const next = nextLevelData(b);
  if (!prereq.ok) {
    ctx.fillStyle = '#FF9800';
    ctx.fillText('升级前置: ' + prereq.msg, cx, ty);
  } else if (!next) {
    ctx.fillStyle = '#777';
    ctx.fillText(b.type === 'mine' || b.type === 'special' ? '该建筑不可升级' : '已满级', cx, ty);
  } else {
    ctx.fillStyle = '#4CAF50';
    ctx.fillText('升级费用: ' + costText(nextCostOf(b)), cx, ty);
  }

  // 按钮
  const btnW = Math.min(140 * game.scale, (popW - 48) / 2);
  const btnH = Math.max(34, 38 * game.scale);
  const btnY = popY + popH - btnH - 16 * Math.max(0.9, game.scale);
  game._popup = { close: null, upgrade: null, demolish: null, sleep: null };

  if (isBed) {
    // 上床/下床按钮（上方）
    const sleepW = btnW * 2 + 8;
    const sleepY = btnY - btnH - 8;
    ctx.fillStyle = '#2196F3';
    drawRoundRect(ctx, cx - sleepW / 2, sleepY, sleepW, btnH, 6);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(12, Math.floor(14 * game.scale))}px Microsoft YaHei`;
    const inBed = game.player && game.player.inBed;
    ctx.fillText(inBed ? '⬇ 下床' : '⬆ 上床睡觉', cx, sleepY + btnH / 2);
    game._popup.sleep = { x: cx - sleepW / 2, y: sleepY, w: sleepW, h: btnH };
  }

  // 升级按钮
  const upX = cx - btnW - 4;
  if (next && prereq.ok) {
    const cost = nextCostOf(b);
    const canAfford = game.gold >= (cost.gold || 0) && game.power >= (cost.energy || 0);
    ctx.fillStyle = canAfford ? '#4CAF50' : '#555';
    drawRoundRect(ctx, upX, btnY, btnW, btnH, 6);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(11, Math.floor(13 * game.scale))}px Microsoft YaHei`;
    ctx.fillText('升级 ' + costText(cost), upX + btnW / 2, btnY + btnH / 2);
    game._popup.upgrade = { x: upX, y: btnY, w: btnW, h: btnH, building: b };
  } else {
    ctx.fillStyle = '#333';
    drawRoundRect(ctx, upX, btnY, btnW, btnH, 6);
    ctx.fill();
    ctx.fillStyle = '#777';
    ctx.font = `${Math.max(11, Math.floor(13 * game.scale))}px Microsoft YaHei`;
    ctx.fillText(next ? '前置不足' : '不可升级', upX + btnW / 2, btnY + btnH / 2);
  }

  // 拆除按钮
  const demolishable = b.type !== 'bed' && b.type !== 'door';
  const dmX = cx + 4;
  if (demolishable) {
    const confirming = game.ui.demolishConfirm && game.ui.demolishConfirm.b === b
      && (performance.now() - game.ui.demolishConfirm.t < 3000);
    ctx.fillStyle = confirming ? '#c62828' : '#795548';
    drawRoundRect(ctx, dmX, btnY, btnW, btnH, 6);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(11, Math.floor(13 * game.scale))}px Microsoft YaHei`;
    ctx.fillText(confirming ? '确认拆除?' : '拆除 ' + refundText(refundOf(b)), dmX + btnW / 2, btnY + btnH / 2);
    game._popup.demolish = { x: dmX, y: btnY, w: btnW, h: btnH, building: b };
  } else {
    ctx.fillStyle = '#333';
    drawRoundRect(ctx, dmX, btnY, btnW, btnH, 6);
    ctx.fill();
    ctx.fillStyle = '#777';
    ctx.font = `${Math.max(11, Math.floor(13 * game.scale))}px Microsoft YaHei`;
    ctx.fillText('不可拆除', dmX + btnW / 2, btnY + btnH / 2);
  }

  // 关闭按钮
  const closeBtnSize = 30 * Math.max(0.9, game.scale);
  const closeX = popX + popW - closeBtnSize - 5;
  const closeY = popY + 5;
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.arc(closeX + closeBtnSize / 2, closeY + closeBtnSize / 2, closeBtnSize / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.max(12, Math.floor(16 * game.scale))}px Microsoft YaHei`;
  ctx.fillText('✕', closeX + closeBtnSize / 2, closeY + closeBtnSize / 2);
  game._popup.close = { x: closeX, y: closeY, w: closeBtnSize, h: closeBtnSize };
}

/** 渲染特殊建筑商店 */
function renderShopPopup(ctx) {
  const W = game.W, H = game.H;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  const popW = Math.min(360 * game.scale, W * 0.94);
  const popH = Math.min(400 * game.scale, H * 0.86);
  const popX = W / 2 - popW / 2;
  const popY = H / 2 - popH / 2;

  if (IMG.ui_GAME_SHOP) {
    ctx.drawImage(IMG.ui_GAME_SHOP, popX, popY, popW, popH);
  } else {
    ctx.fillStyle = 'rgba(20,20,40,0.95)';
    drawRoundRect(ctx, popX, popY, popW, popH, 12);
    ctx.fill();
  }

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(15, Math.floor(20 * game.scale))}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('特殊建筑商店', W / 2, popY + 28 * game.scale);

  const tabs = [
    { key: 'defense', label: '防御' },
    { key: 'passive', label: '被动' },
    { key: 'attack', label: '攻击' },
  ];
  const tabW = popW / 3;
  const tabY = popY + 48 * game.scale;
  game._shopTabs = [];
  const tabFont = Math.max(11, Math.floor(14 * game.scale));
  tabs.forEach((tab, i) => {
    const tx = popX + i * tabW;
    const active = game.ui.shopTab === tab.key;
    ctx.fillStyle = active ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.05)';
    ctx.fillRect(tx, tabY, tabW, 30 * game.scale);
    ctx.fillStyle = active ? '#fff' : '#888';
    ctx.font = `${tabFont}px Microsoft YaHei`;
    ctx.fillText(tab.label, tx + tabW / 2, tabY + 15 * game.scale);
    game._shopTabs.push({ x: tx, y: tabY, w: tabW, h: 30 * game.scale, key: tab.key });
  });

  const listY = tabY + 40 * game.scale;
  const itemH = Math.max(48, 58 * game.scale);
  game._shopItems = [];
  const specials = Object.entries(CONFIG.SPECIALS)
    .filter(([, v]) => v.category === game.ui.shopTab);
  const nameFont = Math.max(11, Math.floor(14 * game.scale));
  const descFont = Math.max(9, Math.floor(11 * game.scale));
  const btnFont = Math.max(10, Math.floor(12 * game.scale));

  specials.forEach(([key, data], i) => {
    const iy = listY + i * (itemH + 8 * game.scale);
    if (iy + itemH > popY + popH - 50 * game.scale) return;

    const owned = hasSpecial(key);
    ctx.fillStyle = owned ? 'rgba(76,175,80,0.15)' : 'rgba(255,255,255,0.05)';
    drawRoundRect(ctx, popX + 10 * game.scale, iy, popW - 20 * game.scale, itemH, 6);
    ctx.fill();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${nameFont}px Microsoft YaHei`;
    ctx.fillText(data.name, popX + 20 * game.scale, iy + itemH * 0.32);
    ctx.fillStyle = '#aaa';
    ctx.font = `${descFont}px Microsoft YaHei`;
    ctx.fillText(data.desc, popX + 20 * game.scale, iy + itemH * 0.7);

    const buyBtnW = Math.max(56, 66 * game.scale);
    const buyBtnH = Math.max(30, itemH * 0.55);
    const buyBtnX = popX + popW - buyBtnW - 16 * game.scale;
    const buyBtnY = iy + (itemH - buyBtnH) / 2;

    ctx.textAlign = 'center';
    if (owned) {
      ctx.fillStyle = '#333';
      drawRoundRect(ctx, buyBtnX, buyBtnY, buyBtnW, buyBtnH, 4);
      ctx.fill();
      ctx.fillStyle = '#888';
      ctx.font = `${btnFont}px Microsoft YaHei`;
      ctx.fillText('已拥有', buyBtnX + buyBtnW / 2, buyBtnY + buyBtnH / 2);
    } else {
      const canAfford = game.power >= data.energy;
      ctx.fillStyle = canAfford ? '#4CAF50' : '#555';
      drawRoundRect(ctx, buyBtnX, buyBtnY, buyBtnW, buyBtnH, 4);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `${btnFont}px Microsoft YaHei`;
      ctx.fillText(formatRes(data.energy) + '能', buyBtnX + buyBtnW / 2, buyBtnY + buyBtnH / 2);
    }

    game._shopItems.push({
      x: buyBtnX, y: buyBtnY, w: buyBtnW, h: buyBtnH,
      key, cost: data.energy, owned,
    });
  });

  const closeSize = 30 * Math.max(0.9, game.scale);
  const closeX = popX + popW - closeSize - 5;
  const closeY = popY + 5;
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.arc(closeX + closeSize / 2, closeY + closeSize / 2, closeSize / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.max(12, Math.floor(16 * game.scale))}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✕', closeX + closeSize / 2, closeY + closeSize / 2);
  game._shopCloseBtn = { x: closeX, y: closeY, w: closeSize, h: closeSize };
}

/** 渲染暂停界面 */
function renderPaused(ctx) {
  const W = game.W, H = game.H;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(22, Math.floor(32 * game.scale))}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('游戏暂停', W / 2, H * 0.35);

  const btnW = 180 * game.scale;
  const btnH = 50 * game.scale;
  const btnX = W / 2 - btnW / 2;
  const btnY = H * 0.48;
  ctx.fillStyle = '#4CAF50';
  drawRoundRect(ctx, btnX, btnY, btnW, btnH, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(14, Math.floor(20 * game.scale))}px Microsoft YaHei`;
  ctx.fillText('继续游戏', W / 2, btnY + btnH / 2);
  game._resumeBtn = { x: btnX, y: btnY, w: btnW, h: btnH };

  const btn2Y = H * 0.6;
  ctx.fillStyle = '#c62828';
  drawRoundRect(ctx, btnX, btn2Y, btnW, btnH, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText('返回主菜单', W / 2, btn2Y + btnH / 2);
  game._quitBtn = { x: btnX, y: btn2Y, w: btnW, h: btnH };
}

/** 渲染结算界面 */
function renderResult(ctx) {
  const W = game.W, H = game.H;
  const isWin = game.result === 'win';
  const bgImg = isWin ? IMG.ui_WIN_RESULT : IMG.ui_LOSE_RESULT;
  if (bgImg) {
    ctx.drawImage(bgImg, 0, 0, W, H);
  } else {
    ctx.fillStyle = isWin ? '#1a2a1a' : '#2a1a1a';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = isWin ? '#4CAF50' : '#F44336';
  ctx.font = `bold ${Math.max(24, Math.floor(36 * game.scale))}px Microsoft YaHei`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(isWin ? '成功击退猛鬼！' : '被猛鬼捕获...', W / 2, H * 0.25);

  ctx.fillStyle = '#ddd';
  ctx.font = `${Math.max(13, Math.floor(16 * game.scale))}px Microsoft YaHei`;
  const stats = game.resultStats;
  const mins = Math.floor(stats.timeSurvived / 60);
  const secs = Math.floor(stats.timeSurvived % 60);
  ctx.fillText(`存活时间: ${mins}分${secs}秒`, W / 2, H * 0.4);
  ctx.fillText(`击杀猛鬼: ${stats.bossesKilled}`, W / 2, H * 0.47);
  ctx.fillText(`累计金币: ${formatRes(stats.goldEarned)}`, W / 2, H * 0.54);

  const btnW = 180 * game.scale;
  const btnH = 50 * game.scale;
  const btnX = W / 2 - btnW / 2;
  const btnY = H * 0.68;
  ctx.fillStyle = '#FF9800';
  drawRoundRect(ctx, btnX, btnY, btnW, btnH, 8);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(14, Math.floor(20 * game.scale))}px Microsoft YaHei`;
  ctx.fillText('返回首页', W / 2, btnY + btnH / 2);
  game._backBtn = { x: btnX, y: btnY, w: btnW, h: btnH };
}

// ========== 主渲染 ==========

function render() {
  const ctx = game.ctx;
  ctx.clearRect(0, 0, game.W, game.H);
  switch (game.state) {
    case STATE.MENU: renderMenu(ctx); break;
    case STATE.SELECT_CHAR: renderSelectChar(ctx); break;
    case STATE.SELECT_LEVEL: renderSelectLevel(ctx); break;
    case STATE.PLAYING: renderPlaying(ctx); break;
    case STATE.PAUSED: renderPlaying(ctx); renderPaused(ctx); break;
    case STATE.RESULT: renderResult(ctx); break;
  }
}

// ========== UI点击处理 ==========

function hitTest(px, py, rect) {
  if (!rect) return false;
  return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
}

function handleClick(px, py) {
  switch (game.state) {
    case STATE.MENU: handleMenuClick(px, py); break;
    case STATE.SELECT_CHAR: handleCharSelectClick(px, py); break;
    case STATE.SELECT_LEVEL: handleLevelSelectClick(px, py); break;
    case STATE.PLAYING: handlePlayingClick(px, py); break;
    case STATE.PAUSED: handlePausedClick(px, py); break;
    case STATE.RESULT: handleResultClick(px, py); break;
  }
}

function handleMenuClick(px, py) {
  if (hitTest(px, py, game._menuBtn)) {
    game.state = STATE.SELECT_CHAR;
    game.sfx.build();
  }
}

function handleCharSelectClick(px, py) {
  if (!game._charAreas) return;
  if (hitTest(px, py, game._charAreas.male)) {
    game.charGender = 'male';
  } else if (hitTest(px, py, game._charAreas.female)) {
    game.charGender = 'female';
  } else if (hitTest(px, py, game._charAreas.confirm)) {
    game.state = STATE.SELECT_LEVEL;
    game.sfx.build();
  }
}

function handleLevelSelectClick(px, py) {
  if (game._levelAreas) {
    for (const area of game._levelAreas) {
      if (hitTest(px, py, area)) {
        game.levelIndex = area.index;
        game.sfx.build();
        return;
      }
    }
  }
  if (hitTest(px, py, game._levelStartBtn)) {
    startGame();
    game.sfx.build();
  }
}

function handlePlayingClick(px, py) {
  // 信息弹窗（模态）
  if (game.ui.infoPopup) {
    const b = game.ui.infoPopup;
    const popup = game._popup || {};
    if (hitTest(px, py, popup.close)) {
      game.ui.infoPopup = null;
      game.ui.demolishConfirm = null;
      return;
    }
    if (popup.sleep && hitTest(px, py, popup.sleep)) {
      if (game.player) {
        game.player.inBed = !game.player.inBed;
        game.sfx.build();
        addFloatText(game.player.col + 0.5, game.player.row, game.player.inBed ? '开始睡觉' : '已下床', '#2196F3');
      }
      return;
    }
    if (popup.upgrade && hitTest(px, py, popup.upgrade)) {
      tryUpgradeBuilding(b);
      return;
    }
    if (popup.demolish && hitTest(px, py, popup.demolish)) {
      const confirming = game.ui.demolishConfirm && game.ui.demolishConfirm.b === b
        && (performance.now() - game.ui.demolishConfirm.t < 3000);
      if (confirming) {
        tryDemolish(b);
      } else {
        game.ui.demolishConfirm = { b, t: performance.now() };
      }
      return;
    }
    // 点击弹窗外关闭
    game.ui.infoPopup = null;
    game.ui.demolishConfirm = null;
    return;
  }

  // 商店弹窗（模态）
  if (game.ui.shopOpen) {
    if (hitTest(px, py, game._shopCloseBtn)) {
      game.ui.shopOpen = false;
      return;
    }
    if (game._shopTabs) {
      for (const tab of game._shopTabs) {
        if (hitTest(px, py, tab)) {
          game.ui.shopTab = tab.key;
          return;
        }
      }
    }
    if (game._shopItems) {
      for (const item of game._shopItems) {
        if (hitTest(px, py, item)) {
          if (!item.owned) {
            if (!hasEmptyCell()) {
              addFloatText(3.5, 1.2, '没有可放置的空格', '#F44336');
              return;
            }
            if (game.power < item.cost) {
              addFloatText(3.5, 1.2, '能量不足(需' + formatRes(item.cost) + ')', '#F44336');
              return;
            }
            // 进入放置模式（放置时才扣费）
            game.ui.shopOpen = false;
            game.ui.selectedBuildType = 'special_' + item.key;
            game.ui.hoverCell = null;
            addFloatText(3.5, 1.2, '请点击绿色格子放置', '#4CAF50');
          }
          return;
        }
      }
    }
    return;
  }

  // 静音
  if (hitTest(px, py, game._muteBtn)) {
    game.muted = !game.muted;
    game.sfx.muted = game.muted;
    return;
  }

  // 暂停
  if (hitTest(px, py, game._pauseBtn)) {
    game.state = STATE.PAUSED;
    return;
  }

  // 提前出怪
  if (game._earlyBtn && hitTest(px, py, game._earlyBtn)) {
    if (game.bossSpawnTimer > 3) {
      spawnBoss();
      game.bossSpawnTimer = CONFIG.BOSS_SPAWN_INTERVAL;
    }
    return;
  }

  // 建造面板按钮
  if (game._buildBtns) {
    for (const btn of game._buildBtns) {
      if (hitTest(px, py, btn)) {
        if (btn.type === 'shop') {
          game.ui.shopOpen = true;
          game.ui.selectedBuildType = null;
          game.ui.hoverCell = null;
        } else {
          game.ui.selectedBuildType = game.ui.selectedBuildType === btn.type ? null : btn.type;
          game.ui.hoverCell = null;
        }
        return;
      }
    }
  }

  // 网格点击
  const gridPos = posToGrid(px, py);
  if (!gridPos) return;
  const { col, row } = gridPos;

  // 已有建筑（含门/床）→ 打开信息弹窗
  if (game.grid[row] && game.grid[row][col]) {
    game.ui.infoPopup = game.grid[row][col];
    game.ui.demolishConfirm = null;
    game.ui.selectedBuildType = null;
    game.ui.hoverCell = null;
    return;
  }

  // 放置建筑
  if (game.ui.selectedBuildType) {
    placeBuilding(game.ui.selectedBuildType, col, row);
  }
}

function handlePausedClick(px, py) {
  if (hitTest(px, py, game._resumeBtn)) {
    game.state = STATE.PLAYING;
    game.lastTimestamp = performance.now();
  } else if (hitTest(px, py, game._quitBtn)) {
    resetGame();
    game.state = STATE.MENU;
  }
}

function handleResultClick(px, py) {
  if (hitTest(px, py, game._backBtn)) {
    resetGame();
    game.state = STATE.MENU;
    game.sfx.build();
  }
}

// ========== 游戏主逻辑 ==========

/** 初始化单局 */
function startGame() {
  resetGame();
  game.state = STATE.PLAYING;

  // 网格
  game.grid = [];
  for (let r = 0; r < CONFIG.GRID_ROWS; r++) {
    game.grid[r] = [];
    for (let c = 0; c < CONFIG.GRID_COLS; c++) game.grid[r][c] = null;
  }

  // 本关可建造格白名单
  game.cells = new Set(CONFIG.LEVELS[game.levelIndex].cells.map(([c, r]) => c + ',' + r));

  // 门（不可拆除）
  game.door = new Door();
  game.grid[2][0] = game.door;

  // 床（不可拆除）
  game.bed = new Bed(1, 2);
  game.buildings.push(game.bed);
  game.grid[2][1] = game.bed;

  // 玩家
  game.player = { col: 1, row: 2, inBed: true };

  game.lastTimestamp = performance.now();
}

/** 彻底重置单局状态 */
function resetGame() {
  game.gold = CONFIG.INIT_GOLD;
  game.power = CONFIG.INIT_POWER;
  game.gameTime = 0;
  game.bossSpawnTimer = CONFIG.FIRST_BOSS_TIME;
  game.buildings = [];
  game.bosses = [];
  game.projectiles = [];
  game.floatTexts = [];
  game.particles = [];
  game.grid = [];
  game.cells = new Set();
  game.door = null;
  game.bed = null;
  game.player = null;
  game.flags = {};
  game.result = null;
  game._winPending = false;
  game.resultStats = { bossesKilled: 0, timeSurvived: 0, goldEarned: 0 };
  game.ui = {
    selectedBuildType: null,
    hoverCell: null,
    infoPopup: null,
    shopOpen: false,
    shopTab: 'defense',
    demolishConfirm: null,
  };
  game.shakeAmount = 0;
  game.shakeTimer = 0;
}

/** 生成Boss（自然刷新与提前出怪共用同一入口） */
function spawnBoss() {
  if (game.state !== STATE.PLAYING) return;
  const boss = new Boss();
  game.bosses.push(boss);
  addFloatText(0.2, 1.6, '猛鬼出现!', '#F44336');
  addParticles(boss.lx, boss.ly, '#F44336', 12);
  game.sfx.ghost();
}

/** 资源与维修结算（全部基于dt） */
function updateResources(dt) {
  let goldIncome = 0;
  let powerIncome = 0;

  // 床：玩家在床上才产出
  if (game.bed && game.player && game.player.inBed) {
    goldIncome += game.bed.income;
  }

  for (const b of game.buildings) {
    if (b.type === 'generator') powerIncome += b.output;
    else if (b.type === 'mine') goldIncome += b.income; // 矿场按明细不持续耗电
  }

  game.power += powerIncome * dt;
  game.gold += goldIncome * dt;
  game.resultStats.goldEarned += goldIncome * dt;

  // 修复台：按等级恢复门最大血量百分比
  if (game.door && game.door.hp > 0) {
    for (const b of game.buildings) {
      if (b.type === 'repair') {
        game.door.hp = Math.min(game.door.maxHp, game.door.hp + game.door.maxHp * (b.pct / 100) * dt);
      }
    }
  }
}

/** 唯一幂等终局入口：门毁优先于同帧Boss死亡 */
function endGame(result) {
  if (game.result) return;
  game.result = result;
  game.state = STATE.RESULT;
  game.resultStats.timeSurvived = game.gameTime;
  if (result === 'win') game.sfx.win();
  else game.sfx.lose();
}

/** 主更新逻辑 */
function update(dt) {
  if (game.state === STATE.MENU) {
    updateAtmosphere(dt);
    return;
  }
  if (game.state !== STATE.PLAYING) return;

  game.gameTime += dt;
  game.animTimer += dt;
  game.animFrame = Math.floor(game.animTimer * 4);

  // Boss刷新调度（首只=开局30秒，之后每30秒）
  game.bossSpawnTimer -= dt;
  if (game.bossSpawnTimer <= 0) {
    spawnBoss();
    game.bossSpawnTimer = CONFIG.BOSS_SPAWN_INTERVAL;
  }

  updateResources(dt);

  if (game.door) game.door.update(dt);

  for (const b of game.buildings) {
    if (b.type === 'tower') b.update(dt);
  }

  for (const boss of game.bosses) boss.update(dt);

  for (const p of game.projectiles) p.update(dt);

  game.projectiles = game.projectiles.filter((p) => !p.dead);
  game.bosses = game.bosses.filter((b) => !b.dead);

  for (const ft of game.floatTexts) ft.update(dt);
  game.floatTexts = game.floatTexts.filter((ft) => ft.life > 0);

  for (const p of game.particles) p.update(dt);
  game.particles = game.particles.filter((p) => p.life > 0);

  updateAtmosphere(dt);

  // 震动衰减（基于dt，帧率无关）
  if (game.shakeTimer > 0) {
    game.shakeTimer -= dt;
    game.shakeAmount *= Math.exp(-5 * dt);
    if (game.shakeAmount < 0.05) game.shakeAmount = 0;
  } else {
    game.shakeAmount = 0;
  }

  // 终局判定（每帧末尾统一处理，门毁优先）
  if (game.door && game.door.hp <= 0) {
    endGame('lose');
  } else if (game._winPending) {
    endGame('win');
  }
}

/** 氛围效果（基于dt） */
function updateAtmosphere(dt) {
  // 闪烁
  game.flickerTimer -= dt;
  if (game.flickerTimer <= 0) {
    game.flickerAlpha = Math.random() > 0.7 ? 1 : 0;
    game.flickerTimer = randRange(2, 8);
  }
  game.flickerAlpha *= Math.exp(-2.5 * dt);
  if (game.flickerAlpha < 0.02) game.flickerAlpha = 0;

  // 幽灵影子
  game.ghostTimer -= dt;
  if (game.ghostTimer <= 0) {
    game.ghostAlpha = Math.random() > 0.6 ? 1 : 0;
    if (game.ghostAlpha > 0) {
      game.ghostLx = randRange(0, CONFIG.GRID_COLS);
      game.ghostLy = randRange(0, CONFIG.GRID_ROWS);
    }
    game.ghostTimer = randRange(5, 15);
  }
  game.ghostAlpha *= Math.exp(-1.5 * dt);
  if (game.ghostAlpha < 0.02) game.ghostAlpha = 0;

  // Boss攻门时屏幕抖动
  for (const boss of game.bosses) {
    if (!boss.dead && boss.isAttacking) {
      game.shakeAmount = Math.max(game.shakeAmount, 2);
      game.shakeTimer = Math.max(game.shakeTimer, 0.1);
    }
  }
}

// ========== 初始化与主循环 ==========

function initCanvas() {
  game.canvas = document.getElementById('gameCanvas');
  game.ctx = game.canvas.getContext('2d');
  resizeCanvas();
}

function resizeCanvas() {
  game.dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制DPR保证性能
  game.W = window.innerWidth;
  game.H = window.innerHeight;
  game.canvas.width = game.W * game.dpr;
  game.canvas.height = game.H * game.dpr;
  game.canvas.style.width = game.W + 'px';
  game.canvas.style.height = game.H + 'px';
  game.ctx.setTransform(game.dpr, 0, 0, game.dpr, 0, 0);
  // 缩放因子只影响渲染尺寸；实体使用逻辑坐标，resize不会错位
  game.scale = Math.min(game.W, game.H) / 600;
}

function gameLoop(timestamp) {
  if (!game.lastTimestamp) game.lastTimestamp = timestamp;
  const rawDt = (timestamp - game.lastTimestamp) / 1000;
  game.lastTimestamp = timestamp;
  const dt = Math.min(rawDt, 0.1); // 限制最大dt，避免后台恢复瞬间跳变

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

/** 统一Pointer输入：按下/抬起位移小于阈值才算点击，避免滑动误触 */
function bindEvents() {
  let pointerDown = null;

  game.canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    game.sfx.resume(); // 首次交互解锁音频
    pointerDown = { x: e.clientX, y: e.clientY };
  }, { passive: false });

  game.canvas.addEventListener('pointermove', (e) => {
    if (game.state === STATE.PLAYING) {
      game.ui.hoverCell = posToGrid(e.clientX, e.clientY);
    }
  });

  game.canvas.addEventListener('pointerup', (e) => {
    e.preventDefault();
    if (!pointerDown) return;
    const dx = e.clientX - pointerDown.x;
    const dy = e.clientY - pointerDown.y;
    if (dx * dx + dy * dy < 144) { // 12px内视为点击
      handleClick(e.clientX, e.clientY);
    }
    pointerDown = null;
  }, { passive: false });

  game.canvas.addEventListener('pointercancel', () => {
    pointerDown = null;
  });

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
}

/** 启动游戏 */
async function main() {
  initCanvas();
  bindEvents();
  preloadAssets(); // 预加载全部素材（不阻塞启动）
  game.lastTimestamp = performance.now();
  requestAnimationFrame(gameLoop);
}

main();
</script>
