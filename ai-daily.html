html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
  line-height:1.6;

}
body::before{

  background-image:radial-gradient(rgba(22,19,15,.055) .6px, transparent .6px);
  background-size:4px 4px;
  mask-image:linear-gradient(#000,rgba(0,0,0,.25));
  -webkit-mask-image:linear-gradient(#000,rgba(0,0,0,.25));
}
.serif{font-family:Georgia,"Times New Roman","Songti SC","Noto Serif CJK SC",SimSun,serif}
.shell{max-width:var(--shell);margin:0 auto;padding:0 24px;position:relative;z-index:1}
a{color:inherit}

/* ---------- HERO ---------- */
.hero{padding:34px 0 26px}
.hero-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:600;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(191,59,37,.14)}
.state{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--ink-2);
  border:1px solid var(--line);background:rgba(255,253,248,.78);
  padding:5px 11px;border-radius:999px;white-space:nowrap;
}
.state .led{width:6px;height:6px;border-radius:50%;background:#3f8f5f}
.state[data-mode="snapshot"] .led{background:#a89880}

.hero-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:36px;align-items:start;margin-top:20px}
.total-wrap{padding-top:4px}
h1.date{
  margin:0;
  font-family:Georgia,"Times New Roman","Songti SC",SimSun,serif;
  font-weight:600;
  font-size:clamp(46px,7.4vw,86px);
  line-height:.98;
  letter-spacing:-.025em;
}
.date-sub{
  margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12.5px;color:var(--muted);letter-spacing:.02em;
}
.date-sub .sep{color:var(--line-2)}
.lead{
  margin:22px 0 0;max-width:60ch;
  font-family:Georgia,"Songti SC",SimSun,serif;
  font-size:clamp(17px,2vw,20px);line-height:1.55;font-weight:600;letter-spacing:-.01em;
}
.lead-p{margin:8px 0 0;max-width:62ch;color:var(--ink-2);font-size:13.5px;line-height:1.75}

.total{text-align:right;line-height:1}
.total span{
  font-family:Georgia,serif;font-size:clamp(52px,7vw,80px);font-weight:600;letter-spacing:-.04em;
  color:var(--accent);font-variant-numeric:tabular-nums;
}
.total em{font-style:normal;font-size:16px;color:var(--muted);margin-left:6px;letter-spacing:.06em}
.total-cap{margin-top:8px;font-size:11.5px;color:var(--muted);letter-spacing:.12em;text-align:right}

/* ---------- STATS ---------- */
.stats{
  margin-top:30px;
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;
}
.stat{
  background:rgba(255,253,248,.92);padding:14px 16px;text-decoration:none;
  display:flex;flex-direction:column;gap:4px;
  transition:background .18s ease;position:relative;
}
.stat:hover{background:#fff}
.stat b{
  font-family:Georgia,serif;font-size:23px;line-height:1.15;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--c);
}
.stat b i{font-style:normal;font-size:10.5px;font-family:inherit;color:var(--muted);margin-left:3px;letter-spacing:.02em}
.stat span{font-size:11.5px;color:var(--ink-2);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat::after{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:var(--c);opacity:.6}

/* ---------- NAV ---------- */
.nav-wrap{
  position:sticky;top:0;z-index:20;
  margin-top:26px;
  background:rgba(244,241,234,.86);
  backdrop-filter:blur(12px) saturate(1.2);
  -webkit-backdrop-filter:blur(12px) saturate(1.2);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav a{
  position:relative;flex:0 0 auto;text-decoration:none;color:var(--ink-2);
  font-size:12.5px;font-weight:600;letter-spacing:.02em;
  padding:13px 14px;white-space:nowrap;transition:color .16s ease;
}
.nav a:first-child{padding-left:0}
.nav a::after{
  content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
  background:var(--c,var(--accent));transform:scaleX(0);transform-origin:left;
  transition:transform .22s cubic-bezier(.2,.7,.2,1);
}
.nav a:first-child::after{left:0}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="true"]{color:var(--ink)}
.nav a[aria-current="true"]::after{transform:scaleX(1)}

/* ---------- SECTIONS ---------- */
main{padding:10px 0 0}
.sec{padding:40px 0 6px;scroll-margin-top:58px}
.sec-head{position:relative;display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.sec-head::after{content:"";position:absolute;left:0;bottom:-1px;width:54px;height:2px;background:var(--c)}
.sec-kicker{width:9px;height:9px;border-radius:2px;background:var(--c);flex:0 0 auto}
.sec-head h2{
  margin:0;font-family:Georgia,"Songti SC",SimSun,serif;
  font-size:clamp(20px,2.6vw,26px);font-weight:600;letter-spacing:-.01em;
}
.sec-count{margin-left:auto;font-size:11.5px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}

.grid{
  margin-top:22px;
  display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
}
/* 单条版块：卡片横跨两列，避免孤零一格 */
.grid.solo > .card{grid-column:span 2}

/* ---------- CARD ---------- */
.card{
  position:relative;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:20px 20px 16px;
  display:flex;flex-direction:column;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 1px 2px rgba(22,19,15,.03);
  transition:transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .2s ease, border-color .2s ease;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);
  transform:scaleY(0);transform-origin:top;transition:transform .24s ease;
}
.card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 10px 24px -14px rgba(22,19,15,.34), 0 2px 6px rgba(22,19,15,.04)}
.card:hover::before{transform:scaleY(1)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.idx{
  font-family:Georgia,serif;font-size:26px;line-height:1;font-weight:600;
  color:var(--c);font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:0 0 auto;
}
.chip{
  margin-left:auto;min-width:0;
  font-size:11px;color:var(--ink-2);
  background:#fff;border:1px solid var(--line);
  padding:3px 9px;border-radius:999px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%;
}
.card h3{margin:0;font-size:15.5px;line-height:1.5;font-weight:600;letter-spacing:-.005em;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.card h3 a{text-decoration:none;color:var(--ink);background-image:linear-gradient(var(--line-2),var(--line-2));

.card:hover h3 a{background-size:100% 1px}
.card p{margin:9px 0 0;font-size:13px;line-height:1.78;color:var(--ink-2);flex:1 1 auto}
.go{
  margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);
  display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
  font-size:12px;font-weight:600;color:var(--c);text-decoration:none;letter-spacing:.02em;
}
.go .arw{transition:transform .2s ease;font-size:13px;line-height:1}
.go:hover .arw{transform:translate(2px,-2px)}

/* ---------- FOOTER ---------- */

.foot{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.foot h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.foot p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.8;max-width:56ch}

.foot .big b{color:var(--accent);font-size:22px;font-variant-numeric:tabular-nums}

.meta-row{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.meta-row span{font-size:11.5px;color:var(--muted)}

  position:fixed;right:20px;bottom:20px;z-index:30;
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line-2);background:rgba(255,253,248,.94);color:var(--ink-2);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 18px -8px rgba(22,19,15,.4);
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;transform:translateY(8px);
}
.top.on{opacity:1;pointer-events:auto;transform:translateY(0)}
.top:hover{color:var(--accent);border-color:var(--accent)}

.notice{
  margin-top:24px;padding:12px 16px;border-radius:10px;
  background:rgba(255,253,248,.7);border:1px dashed var(--line-2);
  font-size:11.5px;color:var(--muted);line-height:1.7;
}
.err{padding:40px 0;color:var(--ink-2);font-size:13.5px;text-align:center}

@media (max-width:900px){
  .hero-main{grid-template-columns:1fr;gap:22px;align-items:start}
  .total{text-align:left;display:flex;align-items:baseline;gap:8px}
  .total-cap{text-align:left;margin-top:0}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .foot{grid-template-columns:1fr;gap:22px}
}
@media (max-width:620px){
  .shell{padding:0 16px}
  .hero{padding:24px 0 18px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats .stat:last-child:nth-child(odd){grid-column:1 / -1}
  .stat b{font-size:20px}
  .grid{grid-template-columns:1fr;gap:14px}
  .grid.solo > .card{grid-column:auto}
  .card{padding:17px 17px 14px}
  .sec{padding:32px 0 4px}
  .nav a{padding:12px 11px;font-size:12px}
  .nav a::after{left:11px;right:11px}
  .top{right:14px;bottom:14px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media print{
  body::before,.top,.nav-wrap{display:none}
  .card{break-inside:avoid;box-shadow:none}
}

          "ref": "https://aihot.news/items/wgss1ksoafvu62x799sdfs0fo"
        },
        {
          "title": "Addy Osmani 讲解如何上手 Claude Code Mods",
          "brief": "Addy Osmani 讲解 Claude Code Mods：用 JS/TS 文件改写会话行为。",
          "src": "X：Addy Osmani (@addyosmani)",
          "url": "https://x.com/addyosmani/status/2115326629488824753",
          "ref": "https://aihot.news/items/tw5fe5mj6a2zyp6ica2ec3qpb"
        },
        {
          "title": "OpenAI 员工撰文探讨 AI 进入企业组织架构的三种方式",
          "brief": "OpenAI 员工撰文探讨 AI 进入企业组织架构的三种方式与分工形态。",
          "src": "OpenAI：官网动态",
          "url": "https://openai.com/index/the-future-of-the-firm",
          "ref": "https://aihot.news/items/neprl0bcwv1mo2pd4dk1lvpjr"
        }
      ]
    }
  ]
};

  var LIVE_URL = "https://aihot.news/api/v1/dailies/latest";

  /* 版块定义：顺序固定，配色与锚点固定 */
  var SECTIONS = [
    { key:"model",    color:"#bf3b25" },
    { key:"product",  color:"#1c6b58" },
    { key:"industry", color:"#2b5c9e" },
    { key:"research", color:"#6a4691" },
    { key:"tips",     color:"#9a6410" }
  ];

  /* ===== 时间格式化：一律转为北京时间人话 ===== */
  function bjParts(iso){
    var d = iso instanceof Date ? iso : new Date(iso);
    if (isNaN(d.getTime())) return null;
    var f = new Intl.DateTimeFormat("zh-CN", {
      timeZone:"Asia/Shanghai", year:"numeric", month:"numeric", day:"numeric",
      weekday:"long", hour:"2-digit", minute:"2-digit", hour12:false
    });
    var o = {};
    f.formatToParts(d).forEach(function(p){ o[p.type] = p.value; });
    return o;
  }
  function bjMD(iso){ var p = bjParts(iso); return p ? p.month + "月" + p.day + "日" : ""; }
  function bjHM(iso){ var p = bjParts(iso); return p ? p.hour + ":" + p.minute : ""; }
  function bjFull(iso){
    var p = bjParts(iso);
    if (!p) return "";
    return p.month + "月" + p.day + "日 " + p.hour + ":" + p.minute;
  }
  function bjWeekday(iso){ var p = bjParts(iso); return p ? p.weekday : ""; }
  function bjYear(iso){ var p = bjParts(iso); return p ? p.year : ""; }

  /* 日期字符串（YYYY-MM-DD）→ 北京时间当天 08:00 的展示 */
  function dateToIso(s){ return s ? s + "T00:00:00Z" : null; }

  /* ===== 摘要裁剪到 60 字内 ===== */
  function cut(txt, max){
    max = max || 60;
    var s = String(txt || "").replace(/\s+/g, " ").trim();
    if (s.length <= max) return s;
    return s.slice(0, max - 1).replace(/[，、；：,;:\s]+$/, "") + "…";
  }

  /* ===== 把接口返回（v1 或旧版 public）归一化成统一结构 ===== */
  function normalize(raw){
    var r = raw && raw.report ? raw.report : raw;
    if (!r || !r.sections) return null;

    var lead = r.lead || {};
    var out = {
      date: r.date,
      generatedAt: r.generatedAt || null,
      windowStart: r.windowStart || null,
      windowEnd: r.windowEnd || null,
      canonical: (r.links && r.links.aihot) || (r.attribution && r.attribution.url) || "https://aihot.news",
      lead: {
        title: lead.title || "",
        text: lead.text || lead.leadParagraph || lead.summary || ""
      },
      sections: []
    };

    r.sections.forEach(function(sec, i){
      var items = (sec.items || []).map(function(it){
        /* 兼容三种字段形态：v1(links/source)、旧版(sourceName/sourceUrl)、内联快照(src/url/ref) */
        var src = (it.source && it.source.name) || it.sourceName || it.src || "AI HOT";
        var orig = (it.links && it.links.original) || it.sourceUrl || it.url || "";
        var perm = (it.links && it.links.aihot) || it.permalink || it.ref || "";
        return {
          title: it.title || "",
          brief: it.brief || cut(it.summary),
          src: cleanSource(src),
          url: orig,
          ref: perm
        };
      });
      out.sections.push({
        label: sec.label || ("版块 " + (i + 1)),
        items: items
      });
    });
    return out;
  }

  /* 来源名去掉冗长的括注，如 “（RSS · 排除企业/客户案例）” */
  function cleanSource(s){
    return String(s || "AI HOT")
      .replace(/[（(]\s*RSS[^）)]*[）)]/gi, "")
      .replace(/\s*[：:]\s*$/, "")
      .replace(/\s{2,}/g, " ")
      .trim();
  }

  /* ===== DOM 工具 ===== */
  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function $(id){ return document.getElementById(id); }

  var state = { data:null, rendered:false };

  /* ===== 渲染 ===== */
  function render(data){
    if (!data || !data.sections || !data.sections.length) return;
    state.data = data;

    var total = data.sections.reduce(function(a, s){ return a + s.items.length; }, 0);

    /* Hero */
    $("dMain").textContent = bjMD(dateToIso(data.date));
    $("dWd").textContent = bjWeekday(dateToIso(data.date));
    $("dYear").textContent = bjYear(dateToIso(data.date)) + " 年";
    $("dWindow").textContent = data.windowStart && data.windowEnd
      ? "收录北京时间 " + bjFull(data.windowStart) + " — " + bjMD(data.windowEnd) + " " + bjHM(data.windowEnd)
      : "北京时间 每日 08:00 发布";
    $("leadTitle").textContent = data.lead.title ? "头条 · " + data.lead.title : "";
    $("leadP").textContent = data.lead.text || "";
    $("totalNum").textContent = total;

    /* 统计条：数字为条目数，非序号 */
    var stats = $("stats");
    stats.textContent = "";
    data.sections.forEach(function(sec, i){
      var c = SECTIONS[i] ? SECTIONS[i].color : "#bf3b25";
      var a = el("a", "stat");
      a.href = "#" + (SECTIONS[i] ? SECTIONS[i].key : ("sec" + i));
      a.style.setProperty("--c", c);
      var b = el("b", null, String(sec.items.length));
      b.appendChild(el("i", null, "条"));
      a.appendChild(b);
      a.appendChild(el("span", null, sec.label));
      stats.appendChild(a);
    });

    /* 导航 */
    var nav = $("nav");
    nav.textContent = "";
    data.sections.forEach(function(sec, i){
      var s = SECTIONS[i] || { key:"sec" + i, color:"#bf3b25" };
      var a = el("a");
      a.href = "#" + s.key;
      a.style.setProperty("--c", s.color);
      a.dataset.target = s.key;
      a.appendChild(document.createTextNode(sec.label));
      nav.appendChild(a);
    });

    /* 正文 */
    var main = $("main");
    main.textContent = "";
    var n = 0;

    data.sections.forEach(function(sec, i){
      var s = SECTIONS[i] || { key:"sec" + i, color:"#bf3b25" };
      var section = el("section", "sec");
      section.id = s.key;
      section.style.setProperty("--c", s.color);

      var head = el("div", "sec-head");
      head.appendChild(el("span", "sec-kicker"));
      head.appendChild(el("h2", "serif", sec.label));
      head.appendChild(el("span", "sec-count", sec.items.length + " 条"));
      section.appendChild(head);

      var grid = el("div", sec.items.length === 1 ? "grid solo" : "grid");
      sec.items.forEach(function(it){
        n += 1;
        grid.appendChild(card(it, n, s.color));
      });
      section.appendChild(grid);
      main.appendChild(section);
    });

    /* 页脚 */
    $("footTotal").textContent = total;
    $("footSecs").textContent = data.sections.length;
    $("footWindow").textContent = data.windowStart && data.windowEnd
      ? "统计窗口：北京时间 " + bjFull(data.windowStart) + " — " + bjFull(data.windowEnd)
      : "";
    $("footGen").textContent = data.generatedAt ? "生成于北京时间 " + bjFull(data.generatedAt) : "";
    try {
      var host = new URL(data.canonical).host;
      $("footCanon").textContent = host;
    } catch (e) {}

    document.title = "AI 日报晨报 · " + data.date;

    state.rendered = true;
    bindScrollSpy();
  }

  function card(it, idx, color){
    var a = el("article", "card");
    a.style.setProperty("--c", color);

    var top = el("div", "card-top");
    top.appendChild(el("span", "idx", String(idx).padStart(2, "0")));
    var chip = el("span", "chip", it.src);
    chip.title = it.src;
    top.appendChild(chip);
    a.appendChild(top);

    var h3 = el("h3");
    var link = el("a", null, it.title);
    link.href = it.url || it.ref || "#";
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    h3.appendChild(link);
    a.appendChild(h3);

    a.appendChild(el("p", null, it.brief));

    if (it.url) {
      var go = el("a", "go");
      go.href = it.url;
      go.target = "_blank";
      go.rel = "noopener noreferrer";
      go.appendChild(document.createTextNode("阅读原文"));
      go.appendChild(el("span", "arw", "↗"));
      a.appendChild(go);
    }
    return a;
  }

  /* ===== 滚动高亮（每次重绘都重新绑定） ===== */
  var spyIO = null;
  var spyScrollBound = false;

  function bindScrollSpy(){
    var links = Array.prototype.slice.call(document.querySelectorAll(".nav a"));
    var secs = Array.prototype.slice.call(document.querySelectorAll(".sec"));
    if (!secs.length) return;

    function setActive(key){
      links.forEach(function(a){
        a.setAttribute("aria-current", a.dataset.target === key ? "true" : "false");
      });
    }
    setActive(secs[0].id);

    if (spyIO) { spyIO.disconnect(); spyIO = null; }

    if ("IntersectionObserver" in window) {
      spyIO = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if (en.isIntersecting) setActive(en.target.id);
        });
      }, { rootMargin:"-96px 0px -62% 0px", threshold:0 });
      secs.forEach(function(s){ spyIO.observe(s); });
      return;
    }

    if (!spyScrollBound) {
      spyScrollBound = true;
      window.addEventListener("scroll", function(){
        var all = Array.prototype.slice.call(document.querySelectorAll(".sec"));
        if (!all.length) return;
        var y = window.scrollY + 120, cur = all[0].id;
        all.forEach(function(s){ if (s.offsetTop <= y) cur = s.id; });
        Array.prototype.slice.call(document.querySelectorAll(".nav a")).forEach(function(a){
          a.setAttribute("aria-current", a.dataset.target === cur ? "true" : "false");
        });
      }, { passive:true });
    }
  }

  /* ===== 回到顶部 ===== */
  var topBtn = $("top");
  topBtn.addEventListener("click", function(){
    window.scrollTo({ top:0, behavior:"smooth" });
  });
  window.addEventListener("scroll", function(){
    topBtn.classList.toggle("on", window.scrollY > 640);
  }, { passive:true });

  /* ===== 启动：先画快照，再静默同步线上接口 ===== */
  function setState(mode, text){
    var box = $("state");
    box.dataset.mode = mode;
    $("stateText").textContent = text;
  }

  var snap = normalize(SNAPSHOT);
  if (snap) {
    render(snap);
    setState("snapshot", "快照 · " + bjMD(dateToIso(snap.date)));
  } else {
    $("main").innerHTML = '<div class="err">没有可用的日报数据。</div>';
  }

  function syncLive(){
    if (typeof fetch !== "function") return;
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 9000) : null;

    fetch(LIVE_URL, {
      cache:"no-store",
      headers:{ "Accept":"application/json" },
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(raw){
      if (timer) clearTimeout(timer);
      var live = normalize(raw);
      if (!live || !live.sections.length) throw new Error("empty");

      if (!state.data || live.date !== state.data.date) {
        render(live);
        bindScrollSpy();
        setState("live", "已更新 · " + bjMD(dateToIso(live.date)));
      } else {
        setState("live", "已同步线上接口");
      }
    }).catch(function(){
      if (timer) clearTimeout(timer);
      setState("snapshot", "离线快照 · " + bjMD(dateToIso(state.data ? state.data.date : new Date().toISOString())));
    });
  }

  if ("requestIdleCallback" in window) {
    requestIdleCallback(syncLive, { timeout: 2000 });
  } else {
    setTimeout(syncLive, 400);
  }
})();
</script>
