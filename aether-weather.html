<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf4ff">
  <title>Aether — Skies & Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Quicksand:wght@400;500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #34435e;
      --muted: #7f8ca1;
      --paper: #fffdf9;
      --line: rgba(52, 67, 94, .13);
      --accent: #e98f78;
      --shadow: 0 18px 45px rgba(85, 111, 145, .10), 0 3px 9px rgba(85, 111, 145, .06);
      --font-body: "Quicksand", "ZCOOL KuaiLe", sans-serif;
      --font-cn: "ZCOOL KuaiLe", sans-serif;
      --font-temp: "Baloo 2", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 10% 5%, rgba(255,255,255,.9) 0 2%, transparent 19%),
        radial-gradient(circle at 92% 24%, rgba(255,235,211,.55), transparent 25%),
        linear-gradient(165deg, #eaf4ff 0%, #f1f6fc 45%, #fdf3ec 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      opacity: .20;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient .orbit {
      position: absolute;
      width: 360px;
      height: 360px;
      border: 1px dashed rgba(103, 137, 167, .15);
      border-radius: 50%;
      top: -180px;
      right: -90px;
    }

    .ambient .orbit::before,
    .ambient .orbit::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(103, 137, 167, .10);
      border-radius: 50%;
      inset: 35px;
    }

    .ambient .orbit::after { inset: 78px; }

    .ambient-star {
      position: absolute;
      width: 18px;
      height: 18px;
      opacity: .38;
      animation: breathe 4s ease-in-out infinite;
    }

    .ambient-star::before,
    .ambient-star::after {
      content: "";
      position: absolute;
      background: #d7a778;
      border-radius: 100%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .ambient-star::before { width: 100%; height: 1px; }
    .ambient-star::after { height: 100%; width: 1px; }
    .ambient-star.one { top: 18%; left: 5%; transform: rotate(18deg); }
    .ambient-star.two { top: 11%; right: 12%; animation-delay: -1.7s; transform: scale(.65) rotate(30deg); }
    .ambient-star.three { bottom: 14%; left: 8%; animation-delay: -2.5s; transform: scale(.8) rotate(45deg); }

    .wind-doodle {
      position: absolute;
      width: 140px;
      height: 65px;
      right: 3vw;
      top: 42%;
      opacity: .18;
      transform: rotate(-8deg);
    }

    .wind-doodle path {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .page {
      width: min(1380px, calc(100% - 64px));
      margin: 0 auto;
    }

    .hero {
      position: relative;
      text-align: center;
      padding: 54px 0 34px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: #8693a5;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 28px;
      height: 1px;
      background: #b4bfca;
    }

    h1 {
      margin: 0;
      font-family: "Fraunces", serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(58px, 7vw, 88px);
      line-height: .98;
      letter-spacing: -.055em;
      color: #34435e;
      text-shadow: 2px 3px 0 rgba(255,255,255,.6);
    }

    .subtitle {
      margin: 10px 0 0;
      color: #75849a;
      font-family: "Fraunces", serif;
      font-style: italic;
      font-size: 21px;
      letter-spacing: .05em;
    }

    .intro {
      margin: 16px 0 0;
      font-family: var(--font-cn);
      font-size: 14px;
      color: #8792a3;
      letter-spacing: .13em;
    }

    .search-wrap {
      position: relative;
      width: min(540px, 100%);
      margin: 29px auto 0;
      z-index: 30;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 55px;
      padding: 0 14px 0 19px;
      border: 1px solid rgba(91, 115, 143, .18);
      border-radius: 18px 20px 17px 21px;
      background: rgba(255, 253, 249, .80);
      box-shadow: 0 10px 28px rgba(88, 112, 141, .08), inset 0 1px 0 white;
      backdrop-filter: blur(16px);
      transition: border-color .25s, box-shadow .25s, transform .25s;
    }

    .search-box:focus-within {
      border-color: rgba(112, 151, 184, .5);
      box-shadow: 0 12px 35px rgba(88, 112, 141, .13), 0 0 0 4px rgba(255,255,255,.45);
      transform: translateY(-2px);
    }

    .search-icon { width: 19px; height: 19px; flex: 0 0 auto; color: #8292a5; }

    #city-search {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-family: var(--font-cn);
      font-size: 15px;
      letter-spacing: .04em;
    }

    #city-search::placeholder { color: #9ca6b3; opacity: 1; }

    .key-hint {
      flex: 0 0 auto;
      padding: 3px 7px;
      border: 1px solid #dce1e5;
      border-bottom-width: 2px;
      border-radius: 6px;
      color: #9aa4b0;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .06em;
    }

    .suggestions {
      position: absolute;
      top: calc(100% + 9px);
      left: 0;
      right: 0;
      padding: 7px;
      margin: 0;
      list-style: none;
      border: 1px solid rgba(91, 115, 143, .14);
      border-radius: 17px;
      background: rgba(255, 253, 250, .97);
      box-shadow: 0 20px 50px rgba(67, 86, 113, .16);
      backdrop-filter: blur(18px);
      transform-origin: top;
      animation: dropdown .2s ease both;
      overflow: hidden;
    }

    .suggestions[hidden] { display: none; }

    .suggestion {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 11px;
      cursor: pointer;
      transition: background .15s;
    }

    .suggestion:hover,
    .suggestion.active { background: #edf4f8; }

    .suggestion-dot {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 50% 46% 52% 45%;
      background: var(--dot, #e7f0f7);
      font-size: 17px;
    }

    .suggestion-name { text-align: left; line-height: 1.15; }
    .suggestion-name strong { display: block; font-family: var(--font-cn); font-weight: 400; font-size: 14px; }
    .suggestion-name small { color: #98a2ae; font-size: 9px; font-weight: 600; letter-spacing: .11em; }

    .suggestion-add {
      margin-left: auto;
      color: #a1acb8;
      font-size: 19px;
      font-weight: 400;
    }

    .empty-suggestion {
      padding: 18px 12px;
      color: #98a2ae;
      text-align: center;
      font-family: var(--font-cn);
      font-size: 13px;
    }

    .collection-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 17px;
      color: #8b96a5;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .collection-bar .label { display: flex; align-items: center; gap: 8px; }
    .collection-bar .label::before { content: ""; width: 17px; height: 1px; background: #a7b3c0; }
    #city-count { letter-spacing: .06em; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .weather-card {
      --scene-ink: #3f5068;
      position: relative;
      min-width: 0;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 25px 28px 24px 27px;
      background: rgba(255, 253, 249, .92);
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
      cursor: default;
      opacity: 0;
      transform: translateY(20px);
      animation: card-in .65s cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay: var(--delay, 0ms);
      transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
    }

    .weather-card:nth-child(3n+2) { border-radius: 28px 23px 27px 24px; }
    .weather-card:nth-child(3n) { border-radius: 23px 28px 25px 26px; }

    .weather-card:hover {
      transform: translateY(-8px) rotate(var(--tilt, -.25deg));
      box-shadow: 0 25px 60px rgba(75, 102, 135, .16), 0 5px 12px rgba(75, 102, 135, .06);
    }

    .weather-card.removing {
      pointer-events: none;
      animation: card-out .28s ease forwards;
    }

    .scene {
      position: relative;
      height: 200px;
      overflow: hidden;
      color: var(--scene-ink);
      background: var(--sky);
      border-bottom: 1px solid rgba(71,87,110,.06);
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      opacity: .13;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
    }

    .scene-sunny { --sky: linear-gradient(155deg, #addbfa 0%, #d9edf5 57%, #ffedc9 100%); --scene-ink: #385873; }
    .scene-cloudy { --sky: linear-gradient(150deg, #bdcede, #e1e5e8 65%, #f3e6d6); --scene-ink: #49596d; }
    .scene-rainy { --sky: linear-gradient(155deg, #809fb8, #b4cbd6 65%, #cbd8d5); --scene-ink: #f8fbf8; }
    .scene-snowy { --sky: linear-gradient(150deg, #bfd7e9, #e6edf2 65%, #f7ede9); --scene-ink: #4a6078; }
    .scene-storm { --sky: linear-gradient(145deg, #4b5874, #758398 58%, #9a9ca4); --scene-ink: #fff9e9; }
    .scene-foggy { --sky: linear-gradient(150deg, #c6d0d2, #e2e4df 60%, #eee4da); --scene-ink: #53636b; }
    .scene-night { --sky: radial-gradient(circle at 75% 20%, #566487 0, #34425f 35%, #222e49 100%); --scene-ink: #fff7dd; }

    .location {
      position: absolute;
      z-index: 12;
      top: 20px;
      left: 21px;
      text-shadow: 0 1px 8px rgba(255,255,255,.2);
    }

    .location h2 {
      margin: 0;
      font-family: var(--font-cn);
      font-size: 23px;
      font-weight: 400;
      letter-spacing: .08em;
      line-height: 1.1;
    }

    .location p {
      margin: 5px 0 0;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .22em;
      opacity: .7;
    }

    .remove-card {
      position: absolute;
      z-index: 20;
      top: 15px;
      right: 15px;
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 50% 46% 50% 45%;
      color: var(--scene-ink);
      background: rgba(255,255,255,.24);
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: scale(.8) rotate(-10deg);
      cursor: pointer;
      transition: opacity .2s, transform .25s, background .2s;
    }

    .weather-card:hover .remove-card,
    .remove-card:focus-visible { opacity: 1; transform: scale(1) rotate(0); }
    .remove-card:hover { background: rgba(255,255,255,.65); transform: rotate(8deg) scale(1.08); }
    .remove-card svg { width: 13px; height: 13px; }

    .sun {
      position: absolute;
      z-index: 2;
      width: 78px;
      height: 78px;
      right: 48px;
      top: 40px;
      border-radius: 48% 52% 47% 53%;
      background: #ffd47f;
      box-shadow: 0 0 0 8px rgba(255,220,143,.15), 0 0 40px rgba(255,208,116,.55);
      animation: sun-float 5s ease-in-out infinite;
    }

    .sun::before {
      content: "";
      position: absolute;
      inset: -20px;
      background: repeating-conic-gradient(from 4deg, rgba(255,210,116,.7) 0deg 1deg, transparent 1deg 30deg);
      -webkit-mask: radial-gradient(circle, transparent 0 54%, #000 55% 67%, transparent 68%);
      mask: radial-gradient(circle, transparent 0 54%, #000 55% 67%, transparent 68%);
      animation: slow-spin 35s linear infinite;
    }

    .sun::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 10px;
      border-bottom: 1.5px solid rgba(177,126,70,.35);
      border-radius: 50%;
      left: 28px;
      top: 42px;
      transform: rotate(-5deg);
    }

    .cloud {
      position: absolute;
      z-index: 4;
      width: 94px;
      height: 29px;
      border-radius: 45% 52% 44% 48%;
      background: var(--cloud, rgba(255,255,255,.8));
      box-shadow: inset 0 -4px 8px rgba(101,127,150,.06), 0 5px 12px rgba(86,111,137,.06);
      animation: cloud-drift var(--speed, 12s) ease-in-out infinite alternate;
      animation-delay: var(--cloud-delay, 0s);
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50% 48% 45% 52%;
      background: inherit;
    }

    .cloud::before { width: 45px; height: 45px; left: 15px; bottom: 5px; transform: rotate(-8deg); }
    .cloud::after { width: 35px; height: 35px; right: 12px; bottom: 4px; }
    .cloud-a { left: -18px; top: 87px; --speed: 14s; --cloud-delay: -4s; }
    .cloud-b { right: 15px; top: 118px; transform: scale(.72); --speed: 17s; --cloud-delay: -9s; }
    .cloud-c { left: 42%; top: 37px; transform: scale(.52); opacity: .66; --speed: 19s; --cloud-delay: -7s; }

    .scene-cloudy .cloud { --cloud: rgba(246,247,244,.88); }
    .scene-cloudy .cloud-a { top: 78px; left: 4%; transform: scale(1.18); }
    .scene-cloudy .cloud-b { top: 113px; right: 4%; transform: scale(.9); }
    .scene-cloudy .cloud-c { top: 49px; left: 52%; transform: scale(.63); }
    .scene-rainy .cloud, .scene-storm .cloud { --cloud: #63788e; box-shadow: inset 0 -6px 10px rgba(37,55,76,.12); }
    .scene-rainy .cloud-a, .scene-storm .cloud-a { left: 7%; top: 77px; transform: scale(1.22); }
    .scene-rainy .cloud-b, .scene-storm .cloud-b { right: 3%; top: 96px; transform: scale(.85); }
    .scene-storm .cloud { --cloud: #3f4b62; }
    .scene-night .cloud { --cloud: rgba(178,188,205,.18); box-shadow: none; }

    .hill {
      position: absolute;
      z-index: 3;
      bottom: -46px;
      width: 125%;
      height: 100px;
      left: -12%;
      border-radius: 48% 52% 0 0;
      background: var(--hill, rgba(150,185,159,.45));
      transform: rotate(var(--hill-rotate, -3deg));
    }

    .hill.back {
      left: 24%;
      bottom: -52px;
      width: 110%;
      background: var(--hill-back, rgba(131,169,151,.34));
      --hill-rotate: 7deg;
    }

    .scene-rainy .hill { --hill: rgba(82,119,119,.35); --hill-back: rgba(89,126,126,.24); }
    .scene-snowy .hill { --hill: rgba(250,250,247,.88); --hill-back: rgba(236,241,241,.8); }
    .scene-storm .hill { --hill: rgba(50,63,76,.5); --hill-back: rgba(63,74,86,.45); }
    .scene-night .hill { --hill: #202d42; --hill-back: #293750; }
    .scene-foggy .hill { --hill: rgba(151,163,151,.35); --hill-back: rgba(139,155,146,.24); }

    .rain-field, .snow-field, .star-field, .fog-field { position: absolute; inset: 0; z-index: 5; pointer-events: none; }

    .drop {
      position: absolute;
      top: -25px;
      left: var(--x);
      width: 1.5px;
      height: var(--h);
      border-radius: 50%;
      background: rgba(224,242,250,.75);
      transform: rotate(12deg);
      animation: rainfall var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    .puddle {
      position: absolute;
      z-index: 6;
      bottom: 13px;
      width: 34px;
      height: 8px;
      border: 1px solid rgba(221,239,242,.5);
      border-radius: 50%;
      animation: ripple-out 2.2s ease-out infinite;
    }
    .puddle.one { left: 28%; }
    .puddle.two { left: 66%; animation-delay: -1.1s; transform: scale(.7); }

    .flake {
      position: absolute;
      top: -15px;
      left: var(--x);
      color: rgba(255,255,255,.92);
      font-size: var(--size);
      font-family: sans-serif;
      line-height: 1;
      text-shadow: 0 1px 3px rgba(98,128,154,.15);
      animation: snowfall var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    .lightning {
      position: absolute;
      z-index: 6;
      top: 95px;
      left: 57%;
      width: 38px;
      height: 76px;
      fill: #ffe6a0;
      filter: drop-shadow(0 0 8px rgba(255,231,151,.85));
      transform: rotate(8deg);
      animation: lightning 4.8s linear infinite;
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 7;
      background: rgba(255,248,213,.45);
      opacity: 0;
      pointer-events: none;
      animation: flash 4.8s linear infinite;
    }

    .fog-line {
      position: absolute;
      left: var(--left);
      top: var(--top);
      width: var(--width);
      height: 17px;
      border-top: 2px solid rgba(255,255,255,.55);
      border-radius: 50%;
      filter: blur(.3px);
      animation: fog-drift var(--speed) ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }

    .fog-line::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 15%;
      width: 70%;
      border-top: 1px solid rgba(255,255,255,.35);
      border-radius: 50%;
    }

    .moon {
      position: absolute;
      z-index: 3;
      top: 35px;
      right: 47px;
      width: 64px;
      height: 64px;
      border-radius: 50% 47% 52% 48%;
      background: #fff0ba;
      box-shadow: 0 0 35px rgba(255,235,174,.28);
      animation: moon-glow 5s ease-in-out infinite;
    }

    .moon::before {
      content: "";
      position: absolute;
      width: 58px;
      height: 58px;
      left: -12px;
      top: -8px;
      border-radius: 50%;
      background: #3b4968;
    }

    .moon::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      right: 9px;
      bottom: 13px;
      border-radius: 50%;
      background: rgba(209,187,132,.25);
      box-shadow: 7px -10px 0 2px rgba(209,187,132,.17);
    }

    .star {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: #fff2c6;
      box-shadow: 0 0 5px rgba(255,241,195,.7);
      animation: twinkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .star.cross { border-radius: 0; clip-path: polygon(45% 0,55% 0,55% 45%,100% 45%,100% 55%,55% 55%,55% 100%,45% 100%,45% 55%,0 55%,0 45%,45% 45%); }

    .shooting-star {
      position: absolute;
      z-index: 4;
      top: 40px;
      left: 27%;
      width: 55px;
      height: 1px;
      opacity: 0;
      transform: rotate(-24deg);
      background: linear-gradient(90deg, transparent, #fff4cc);
      animation: shoot 8s ease-in infinite 2s;
    }

    .bird {
      position: absolute;
      z-index: 5;
      width: 16px;
      height: 8px;
      border-top: 1.5px solid currentColor;
      border-radius: 50%;
      opacity: .45;
      animation: bird-float 5s ease-in-out infinite;
    }
    .bird::after { content: ""; position: absolute; width: 100%; height: 100%; left: 12px; top: -1px; border-top: 1.5px solid currentColor; border-radius: 50%; transform: scaleX(-1); }
    .bird.one { left: 38%; top: 73px; }
    .bird.two { left: 48%; top: 93px; transform: scale(.65); animation-delay: -2s; }

    .card-body { padding: 18px 21px 19px; }

    .condition-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    .condition {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-cn);
      font-size: 13px;
      letter-spacing: .06em;
    }

      rainy:  { name: "小雨", en: "Rainy", icon: "☂", color: "#719fb9", dot: "#dcebf2" },
      snowy:  { name: "飘雪", en: "Snowy", icon: "❄", color: "#92b8cc", dot: "#e4f0f6" },
      storm:  { name: "雷阵雨", en: "Thunderstorm", icon: "ϟ", color: "#a294bd", dot: "#e9e3f0" },
      foggy:  { name: "薄雾", en: "Foggy", icon: "≋", color: "#9ba9a5", dot: "#e9ede8" },
      night:  { name: "晴夜", en: "Clear night", icon: "☾", color: "#a99cbd", dot: "#e8e4f0" }
    };

    const DEFAULT_CITIES = [
      { id: "geo-1816670", name: "北京", en: "BEIJING", country: "中国", admin1: "北京", latitude: 39.9042, longitude: 116.4074, timezone: "Asia/Shanghai" },
      { id: "geo-1796236", name: "上海", en: "SHANGHAI", country: "中国", admin1: "上海", latitude: 31.2304, longitude: 121.4737, timezone: "Asia/Shanghai" },
      { id: "geo-1850147", name: "东京", en: "TOKYO", country: "日本", admin1: "东京都", latitude: 35.6762, longitude: 139.6503, timezone: "Asia/Tokyo" },
      { id: "geo-2037013", name: "哈尔滨", en: "HARBIN", country: "中国", admin1: "黑龙江", latitude: 45.8038, longitude: 126.5349, timezone: "Asia/Shanghai" },
      { id: "geo-5128581", name: "纽约", en: "NEW YORK", country: "美国", admin1: "纽约州", latitude: 40.7128, longitude: -74.006, timezone: "America/New_York" },
      { id: "geo-2988507", name: "巴黎", en: "PARIS", country: "法国", admin1: "法兰西岛", latitude: 48.8566, longitude: 2.3522, timezone: "Europe/Paris" }
    ];

    const MAX_MAIN = 6;
    const CACHE_TTL = 10 * 60 * 1000;
    const STORAGE_KEY = "aether-realtime-v2";
    const grid = document.getElementById("weather-grid");
    const search = document.getElementById("city-search");
    const suggestions = document.getElementById("suggestions");
    const count = document.getElementById("city-count");
    const savedCount = document.getElementById("saved-count");
    const toastRegion = document.getElementById("toast-region");
    const dialog = document.getElementById("weather-list-dialog");
    const savedList = document.getElementById("saved-list");
    const refreshButton = document.getElementById("refresh-weather");
    const openListButton = document.getElementById("open-weather-list");

    let state = loadState();
    let currentMatches = [];
    let activeSuggestion = -1;
    let searchStatus = "idle";
    let searchTimer = null;
    let searchController = null;
    let searchSequence = 0;
    let refreshing = false;
    const freshCards = new Set(state.mainCities.map(city => city.id));
    const requestStatus = {};
    const inFlightWeather = new Map();

    function defaultState() {
      return { version: 2, mainCities: DEFAULT_CITIES.map(city => ({ ...city })), savedCities: [], weatherCache: {} };
    }

    function cleanText(value, maxLength = 100) {
      return typeof value === "string" ? value.trim().slice(0, maxLength) : "";
    }

    function isFiniteValue(value) {
      return value !== null && value !== undefined && value !== "" && Number.isFinite(Number(value));
    }

    function sanitizeCity(city) {
      if (!city || !/^geo-\d+$/.test(city.id || "")) return null;
      const latitude = Number(city.latitude);
      const longitude = Number(city.longitude);
      if (!isFiniteValue(city.latitude) || !isFiniteValue(city.longitude) || Math.abs(latitude) > 90 || Math.abs(longitude) > 180) return null;
      const name = cleanText(city.name, 80);
      if (!name) return null;
      return {
        id: city.id,
        name,
        en: cleanText(city.en || name, 100).toUpperCase(),
        country: cleanText(city.country, 80),
        admin1: cleanText(city.admin1, 80),
        latitude,
        longitude,
        timezone: cleanText(city.timezone || "auto", 80)
      };
    }

    function sanitizeWeather(weather) {
      if (!weather || !WEATHER[weather.weather]) return null;
      const keys = ["temp", "high", "low", "humidity", "wind", "fetchedAt"];
      if (keys.some(key => !isFiniteValue(weather[key]))) return null;
      return {
        temp: Number(weather.temp), high: Number(weather.high), low: Number(weather.low),
        humidity: Number(weather.humidity), wind: Number(weather.wind),
        weather: weather.weather, code: Number(weather.code), isDay: Number(weather.isDay),
        fetchedAt: Number(weather.fetchedAt), observedAt: cleanText(weather.observedAt, 40)
      };
    }

    function loadState() {
      const fallback = defaultState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const saved = JSON.parse(raw);
        if (!saved || saved.version !== 2) return fallback;
        const cleanList = list => {
          const seen = new Set();
          return (Array.isArray(list) ? list : []).map(sanitizeCity).filter(city => {
            if (!city || seen.has(city.id)) return false;
            seen.add(city.id);
            return true;
          });
        };
        const mainCities = cleanList(saved.mainCities).slice(-MAX_MAIN);
        const savedCities = cleanList(saved.savedCities);
        const weatherCache = {};
        Object.entries(saved.weatherCache || {}).forEach(([id, weather]) => {
          const clean = sanitizeWeather(weather);
          if (clean && /^geo-\d+$/.test(id)) weatherCache[id] = clean;
        });
        return { version: 2, mainCities, savedCities, weatherCache };
      } catch (error) {
        return fallback;
      }
    }

    function saveState() {
      try {
        const relevantIds = new Set([...state.mainCities, ...state.savedCities].map(city => city.id));
        const weatherCache = {};
        Object.entries(state.weatherCache).forEach(([id, weather]) => {
          if (relevantIds.has(id)) weatherCache[id] = weather;
        });
        state.weatherCache = weatherCache;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        // The page remains functional when storage is unavailable (for example, private file previews).
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[character]);
    }

    function normalize(value) {
      return value.trim().toLowerCase().replace(/\s+/g, " ");
    }

    function normalizeGeocoding(result) {
      return sanitizeCity({
        id: `geo-${result.id}`, name: result.name, en: result.name,
        country: result.country || "", admin1: result.admin1 || "",
        latitude: result.latitude, longitude: result.longitude, timezone: result.timezone || "auto"
      });
    }

    function formatRegion(city) {
      return [...new Set([city.admin1, city.country].filter(part => part && part !== city.name))].join(" · ") || city.en;
    }

    function findCity(id) {
      return [...state.mainCities, ...state.savedCities].find(city => city.id === id) || currentMatches.find(city => city.id === id);
    }

    function findCard(id) {
      return [...grid.querySelectorAll(".weather-card")].find(card => card.dataset.id === id);
    }

    function mapWeatherCode(code, isDay) {
      if ([95, 96, 99].includes(code)) return "storm";
      if ([71, 73, 75, 77, 85, 86].includes(code)) return "snowy";
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rainy";
      if ([45, 48].includes(code)) return "foggy";
      if ([2, 3].includes(code)) return "cloudy";
      if ([0, 1].includes(code)) return isDay ? "sunny" : "night";
      return "cloudy";
    }

    async function fetchWeather(city) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      const params = new URLSearchParams({
        latitude: String(city.latitude), longitude: String(city.longitude),
        current: "temperature_2m,relative_humidity_2m,is_day,weather_code,wind_speed_10m",
        daily: "temperature_2m_max,temperature_2m_min", timezone: "auto", forecast_days: "1"
      });
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`, { signal: controller.signal });
        if (!response.ok) throw new Error(`天气服务返回 ${response.status}`);
        const data = await response.json();
        const current = data.current;
        const daily = data.daily;
        const values = [current?.temperature_2m, current?.relative_humidity_2m, current?.wind_speed_10m, daily?.temperature_2m_max?.[0], daily?.temperature_2m_min?.[0]];
        if (values.some(value => !isFiniteValue(value)) || !isFiniteValue(current?.weather_code)) {
          throw new Error("天气数据不完整");
        }
        const code = Number(current.weather_code);
        const isDay = Number(current.is_day) === 1 ? 1 : 0;
        return {
          temp: Number(current.temperature_2m), high: Number(daily.temperature_2m_max[0]), low: Number(daily.temperature_2m_min[0]),
          humidity: Number(current.relative_humidity_2m), wind: Number(current.wind_speed_10m),
          code, isDay, weather: mapWeatherCode(code, isDay), fetchedAt: Date.now(), observedAt: cleanText(current.time, 40)
        };
      } finally {
        clearTimeout(timeout);
      }
    }

    function loadCity(id, force = false) {
      const city = findCity(id);
      if (!city) return Promise.resolve(null);
      const cached = state.weatherCache[id];
      if (!force && cached && Date.now() - cached.fetchedAt < CACHE_TTL) {
        requestStatus[id] = { status: "ready" };
        return Promise.resolve(cached);
      }
      if (inFlightWeather.has(id)) return inFlightWeather.get(id);
      requestStatus[id] = { status: cached ? "refreshing" : "loading" };
      render();
      const request = fetchWeather(city).then(weather => {
        state.weatherCache[id] = weather;
        requestStatus[id] = { status: "ready" };
        saveState();
        render();
        return weather;
      }).catch(error => {
        requestStatus[id] = { status: "error", message: error.name === "AbortError" ? "请求超时，请稍后重试" : error.message };
        render();
        return null;
      }).finally(() => inFlightWeather.delete(id));
      inFlightWeather.set(id, request);
      return request;
    }

    function seededItems(id, type, amount) {
      let seed = [...id].reduce((sum, char) => sum + char.charCodeAt(0), 0);
      const random = () => {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      };
      return Array.from({ length: amount }, (_, i) => {
        const x = Math.round(random() * 96);
        const delay = (-random() * 8).toFixed(2);
        const duration = (type === "rain" ? .75 + random() * .65 : 3.8 + random() * 3.5).toFixed(2);
        if (type === "rain") return `<i class="drop" style="--x:${x}%;--h:${10 + Math.round(random() * 11)}px;--duration:${duration}s;--delay:${delay}s"></i>`;
        if (type === "snow") return `<i class="flake" style="--x:${x}%;--size:${7 + Math.round(random() * 8)}px;--duration:${duration}s;--delay:${delay}s">${i % 3 === 0 ? "✦" : "•"}</i>`;
        const size = (1.5 + random() * 2.5).toFixed(1);
        return `<i class="star ${i % 5 === 0 ? "cross" : ""}" style="--x:${x}%;--y:${8 + Math.round(random() * 68)}%;--size:${size}px;--duration:${2 + random() * 3}s;--delay:${delay}s"></i>`;
      }).join("");
    }

    function clouds() {
      return '<div class="cloud cloud-a"></div><div class="cloud cloud-b"></div><div class="cloud cloud-c"></div>';
    }

    function sceneFor(city) {
      const commonHills = '<div class="hill back"></div><div class="hill"></div>';
      switch (city.weather) {
        case "sunny": return `<div class="sun"></div>${clouds()}<i class="bird one"></i><i class="bird two"></i>${commonHills}`;
        case "cloudy": return `${clouds()}<i class="bird one"></i>${commonHills}`;
        case "rainy": return `${clouds()}<div class="rain-field">${seededItems(city.id, "rain", 30)}</div><i class="puddle one"></i><i class="puddle two"></i>${commonHills}`;
        case "snowy": return `${clouds()}<div class="snow-field">${seededItems(city.id, "snow", 28)}</div>${commonHills}`;
        case "storm": return `${clouds()}<div class="rain-field">${seededItems(city.id, "rain", 24)}</div><svg class="lightning" viewBox="0 0 40 80" aria-hidden="true"><path d="M25 1 6 42h14l-5 36 22-49H23z"/></svg><div class="flash"></div>${commonHills}`;
        case "foggy": return `<div class="sun" style="opacity:.25;filter:grayscale(.5)"></div>${clouds()}<div class="fog-field">${[
          ["-8%","72px","74%","8s","-3s"],["28%","105px","88%","11s","-7s"],["-16%","139px","92%","9s","-5s"],["42%","158px","72%","12s","-2s"]
        ].map(v => `<i class="fog-line" style="--left:${v[0]};--top:${v[1]};--width:${v[2]};--speed:${v[3]};--delay:${v[4]}"></i>`).join("")}</div>${commonHills}`;
        case "night": return `<div class="star-field">${seededItems(city.id, "stars", 30)}</div><div class="moon"></div><i class="shooting-star"></i>${clouds()}${commonHills}`;
        default: return commonHills;
      }
    }

    function observationTime(observation) {
      const local = observation.observedAt.split("T")[1];
      if (local) return `${local.slice(0, 5)} 当地观测`;
      const date = new Date(observation.fetchedAt);
      return `${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")} 更新`;
    }

    function cardTemplate(city, index) {
      const observation = state.weatherCache[city.id];
      const status = requestStatus[city.id]?.status || (observation ? "ready" : "loading");
      const sceneType = observation?.weather || "cloudy";
      const id = escapeHtml(city.id);
      const name = escapeHtml(city.name);
      let body = "";
      if (observation) {
        const weather = WEATHER[observation.weather];
        const stale = status === "error";
        body = `<div class="condition-row">
          <span class="condition" style="--weather-color:${weather.color}"><i class="condition-dot"></i>${weather.name}</span>
          <span class="condition-en">${weather.en}</span>
        </div>
        <div class="temp-row">
          <div class="temperature">${Math.round(observation.temp)}<sup>°C</sup></div>
          <div class="high-low"><span class="high">↑ ${Math.round(observation.high)}°</span><span class="low">↓ ${Math.round(observation.low)}°</span></div>
        </div>
        <div class="metrics">
          <div class="metric"><svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11Z"/><path d="M9 15c.4 1.4 1.3 2 2.6 2.2" stroke-linecap="round"/></svg><div><span class="metric-value">${Math.round(observation.humidity)}%</span><span class="metric-label">湿度 · Humidity</span></div></div>
          <div class="metric"><svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 8h11c4 0 4-5 1-5-2 0-2 2-2 2M3 12h15c4 0 4 6 0 6-2 0-2-2-2-2M3 16h7"/></svg><div><span class="metric-value">${Math.round(observation.wind)} <small>km/h</small></span><span class="metric-label">风速 · Wind</span></div></div>
        </div>
        <div class="updated-at ${stale ? "stale" : ""}">${stale ? "更新失败 · 展示上次数据" : escapeHtml(observationTime(observation))}${stale ? ` <button class="retry-inline" type="button" data-retry="${id}">重试</button>` : ""}</div>`;
      } else if (status === "error") {
        body = `<div class="card-status"><span class="error-symbol">Clouded over</span><span>这片天空暂时迷路了</span><small>${escapeHtml(requestStatus[city.id]?.message || "网络连接失败，请稍后重试")}</small><button class="retry-card" type="button" data-retry="${id}">重新获取天气</button></div>`;
      } else {
        body = '<div class="card-status"><span class="loading-orbit"></span><span>正在读取这片天空…</span><small>LIVE WEATHER · OPEN-METEO</small></div>';
      }
      const aria = observation ? `${name}，${WEATHER[observation.weather].name}，${Math.round(observation.temp)}摄氏度` : `${name}，天气加载中`;
      return `<article class="weather-card ${freshCards.has(city.id) ? "fresh" : ""}" data-id="${id}" style="--delay:${Math.min(index * 65, 390)}ms;--tilt:${index % 2 ? ".25deg" : "-.25deg"}" aria-label="${aria}">
        <div class="scene scene-${sceneType}">
          <div class="location"><h2>${name}</h2><p>${escapeHtml(city.en)}</p></div>
          <button class="remove-card" type="button" data-remove="${id}" aria-label="从主体移除${name}" title="从主体移除"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m3 3 10 10M13 3 3 13"/></svg></button>
          ${sceneFor({ id: city.id, weather: sceneType })}${observation ? '<span class="live-pill">LIVE</span>' : ""}
        </div>
        <div class="card-body">${body}</div>
      </article>`;
    }

    function render() {
      grid.innerHTML = state.mainCities.map(cardTemplate).join("");
      count.textContent = `${String(state.mainCities.length).padStart(2, "0")} / 06 places`;
      savedCount.textContent = String(state.savedCities.length);
      if (dialog.open) renderSavedList();
      if (!suggestions.hidden && searchStatus === "ready") renderSuggestions();
      if (freshCards.size) setTimeout(() => freshCards.clear(), 900);
    }

    function renderSavedList() {
      if (!state.savedCities.length) {
        savedList.innerHTML = '<div class="empty-list"><span class="empty-cloud">aether</span><strong>口袋里还没有天空</strong><p>搜索一座城市，点击搜索结果旁的 ＋<br>就能把它收藏到这里。</p></div>';
        return;
      }
      savedList.innerHTML = state.savedCities.map(city => {
        const observation = state.weatherCache[city.id];
        const status = requestStatus[city.id]?.status || (observation ? "ready" : "loading");
        const weather = observation ? WEATHER[observation.weather] : null;
        const id = escapeHtml(city.id);
        const shown = state.mainCities.some(item => item.id === city.id);
        let observationHtml = `<div class="saved-loading ${status === "error" ? "saved-error" : ""}">${status === "error" ? "暂时无法获取天气" : "正在读取实时天气…"}${status === "error" ? ` <button class="retry-inline" type="button" data-retry="${id}">重试</button>` : ""}</div>`;
        if (observation) observationHtml = `<div class="saved-observation"><strong>${Math.round(observation.temp)}°</strong><span>${weather.name}</span><small>↑ ${Math.round(observation.high)}° ↓ ${Math.round(observation.low)}° · 湿度 ${Math.round(observation.humidity)}%</small></div>${status === "error" ? `<div class="saved-loading saved-error">显示上次数据 <button class="retry-inline" type="button" data-retry="${id}">重试</button></div>` : ""}`;
        return `<article class="saved-item" data-saved-id="${id}">
          <div><div class="saved-place"><span class="saved-weather-icon" style="--dot:${weather?.dot || "#e9eff2"}">${weather?.icon || "·"}</span><div class="saved-place-text"><h3>${escapeHtml(city.name)}</h3><p>${escapeHtml(formatRegion(city))}</p></div></div>${observationHtml}</div>
          <div class="saved-actions"><button class="saved-action" type="button" data-saved-show="${id}" ${shown ? "disabled" : ""}>${shown ? "已展示" : "展示"}</button><button class="saved-action delete" type="button" data-saved-remove="${id}">删除</button></div>
        </article>`;
      }).join("");
    }

    function renderSuggestions() {
      activeSuggestion = -1;
      if (searchStatus === "loading") {
        suggestions.innerHTML = '<li class="suggestion-status">正在寻找城市…<span class="search-tip">SEARCHING THE ATLAS</span></li>';
        return;
      }
      if (searchStatus === "error") {
        suggestions.innerHTML = '<li class="suggestion-status">城市搜索暂时不可用<span class="search-tip">请检查网络后重新输入</span></li>';
        return;
      }
      if (!currentMatches.length) {
        suggestions.innerHTML = '<li class="suggestion-status">没有找到这座城市<span class="search-tip">试试中文、英文或更完整的名称</span></li>';
        return;
      }
      suggestions.innerHTML = currentMatches.map((city, index) => {
        const shown = state.mainCities.some(item => item.id === city.id);
        const saved = state.savedCities.some(item => item.id === city.id);
        return `<li class="suggestion" role="option" aria-selected="false" data-index="${index}">
          <button class="suggestion-main" type="button" data-show-index="${index}" ${shown ? "disabled" : ""}>
            <span class="suggestion-dot">✧</span><span class="suggestion-name"><strong>${escapeHtml(city.name)}</strong><small>${escapeHtml(formatRegion(city))}</small></span><span class="suggestion-show">${shown ? "已展示" : "展示 ↗"}</span>
          </button>
          <button class="save-search" type="button" data-save-index="${index}" aria-label="${saved ? "已加入" : "加入"}${escapeHtml(city.name)}天气列表" title="${saved ? "已在天气列表" : "加入天气列表"}" ${saved ? "disabled" : ""}>${saved ? "✓" : "＋"}</button>
        </li>`;
      }).join("");
    }

    function closeSuggestions() {
      suggestions.hidden = true;
      search.setAttribute("aria-expanded", "false");
      activeSuggestion = -1;
    }

    function openSuggestions() {
      suggestions.hidden = false;
      search.setAttribute("aria-expanded", "true");
      renderSuggestions();
    }

    async function searchCities() {
      const query = normalize(search.value);
      if (query.length < 2) return closeSuggestions();
      if (searchController) searchController.abort();
      const controller = new AbortController();
      searchController = controller;
      let timedOut = false;
      const timeout = setTimeout(() => {
        timedOut = true;
        controller.abort();
      }, 12000);
      const sequence = ++searchSequence;
      searchStatus = "loading";
      currentMatches = [];
      openSuggestions();
      try {
        const params = new URLSearchParams({ name: query, count: "6", language: "zh", format: "json" });
        const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?${params}`, { signal: controller.signal });
        if (!response.ok) throw new Error("搜索服务不可用");
        const data = await response.json();
        if (sequence !== searchSequence) return;
        currentMatches = (data.results || []).map(normalizeGeocoding).filter(Boolean).slice(0, 6);
        searchStatus = "ready";
        renderSuggestions();
      } catch (error) {
        if (sequence !== searchSequence || (error.name === "AbortError" && !timedOut)) return;
        searchStatus = "error";
        currentMatches = [];
        renderSuggestions();
      } finally {
        clearTimeout(timeout);
        if (searchController === controller) searchController = null;
      }
    }

    function queueSearch() {
      clearTimeout(searchTimer);
      const query = normalize(search.value);
      if (query.length < 2) {
        searchSequence++;
        if (searchController) searchController.abort();
        currentMatches = [];
        closeSuggestions();
        return;
      }
      searchTimer = setTimeout(searchCities, 320);
    }

    function setActiveSuggestion(index) {
      const options = suggestions.querySelectorAll(".suggestion[data-index]");
      if (!options.length) return;
      activeSuggestion = (index + options.length) % options.length;
      options.forEach((option, i) => {
        const active = i === activeSuggestion;
        option.classList.toggle("active", active);
        option.setAttribute("aria-selected", String(active));
        if (active) option.scrollIntoView({ block: "nearest" });
      });
    }

    function showCity(city) {
      if (!city) return;
      search.value = "";
      closeSuggestions();
      if (state.mainCities.some(item => item.id === city.id)) {
        findCard(city.id)?.scrollIntoView({ behavior: "smooth", block: "center" });
        showToast(`${city.name} 已在主体展示`, "↗");
        return;
      }
      const replaced = state.mainCities.length >= MAX_MAIN ? state.mainCities.shift() : null;
      state.mainCities.push({ ...city });
      freshCards.add(city.id);
      saveState();
      render();
      loadCity(city.id);
      findCard(city.id)?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      showToast(replaced ? `已展示 ${city.name}，替换最早的 ${replaced.name}` : `已展示 ${city.name} 的实时天空`, "↗");
    }

    function addToList(city) {
      if (!city) return;
      if (state.savedCities.some(item => item.id === city.id)) {
        showToast(`${city.name} 已在天气列表`, "✓");
        return;
      }
      state.savedCities.push({ ...city });
      saveState();
      render();
      loadCity(city.id);
      showToast(`已将 ${city.name} 加入天气列表`, "+");
    }

    function removeCity(id) {
      const city = state.mainCities.find(item => item.id === id);
      const card = findCard(id);
      if (!city || !card) return;
      card.classList.add("removing");
      setTimeout(() => {
        state.mainCities = state.mainCities.filter(item => item.id !== id);
        saveState();
        render();
        showToast(`已从主体移出 ${city.name}`, "↗");
      }, 240);
    }

    function removeFromList(id) {
      const city = state.savedCities.find(item => item.id === id);
      if (!city) return;
      state.savedCities = state.savedCities.filter(item => item.id !== id);
      if (!state.mainCities.some(item => item.id === id)) delete state.weatherCache[id];
      saveState();
      render();
      showToast(`已从天气列表删除 ${city.name}`, "×");
    }

    function showToast(message, icon = "✓") {
      const toast = document.createElement("div");
      toast.className = "toast";
      const symbol = document.createElement("span");
      symbol.className = "toast-check";
      symbol.textContent = icon;
      const text = document.createElement("span");
      text.textContent = message;
      toast.append(symbol, text);
      toastRegion.appendChild(toast);
      while (toastRegion.children.length > 3) toastRegion.firstElementChild.remove();
      setTimeout(() => {
        toast.classList.add("leaving");
        setTimeout(() => toast.remove(), 250);
      }, 2600);
    }

    async function refreshAll(manual = false) {
      if (refreshing) return;
      const cities = dialog.open ? [...state.mainCities, ...state.savedCities] : state.mainCities;
      const unique = [...new Map(cities.map(city => [city.id, city])).values()];
      if (!unique.length) {
        if (manual) showToast("还没有需要刷新的天空", "☁");
        return;
      }
      refreshing = true;
      refreshButton.classList.add("refreshing");
      refreshButton.disabled = true;
      const results = await Promise.allSettled(unique.map(city => loadCity(city.id, manual)));
      const updated = results.filter(result => result.status === "fulfilled" && result.value).length;
      refreshing = false;
      refreshButton.classList.remove("refreshing");
      refreshButton.disabled = false;
      if (manual) showToast(updated ? `已更新 ${updated} 片天空` : "暂时无法更新，请检查网络后重试", updated ? "✓" : "☁");
    }

    function openWeatherList() {
      closeSuggestions();
      if (!dialog.open) dialog.showModal();
      renderSavedList();
      Promise.allSettled(state.savedCities.map(city => loadCity(city.id)));
    }

    search.addEventListener("input", queueSearch);
    search.addEventListener("focus", () => {
      if (normalize(search.value).length >= 2) {
        if (currentMatches.length || searchStatus === "error") openSuggestions();
        else searchCities();
      }
    });
    search.addEventListener("keydown", event => {
      if (event.isComposing) return;
      if (event.key === "ArrowDown") {
        event.preventDefault();
        setActiveSuggestion(activeSuggestion + 1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        setActiveSuggestion(activeSuggestion - 1);
      } else if (event.key === "Enter") {
        event.preventDefault();
        const target = currentMatches[activeSuggestion] || currentMatches[0];
        if (target) showCity(target);
        else if (normalize(search.value).length >= 2 && searchStatus !== "loading") searchCities();
      } else if (event.key === "Escape") {
        closeSuggestions();
        search.blur();
      }
    });

    suggestions.addEventListener("mousedown", event => event.preventDefault());
    suggestions.addEventListener("click", event => {
      const show = event.target.closest("[data-show-index]");
      const save = event.target.closest("[data-save-index]");
      if (show) showCity(currentMatches[Number(show.dataset.showIndex)]);
      if (save) {
        addToList(currentMatches[Number(save.dataset.saveIndex)]);
        renderSuggestions();
      }
    });

    grid.addEventListener("click", event => {
      const removeButton = event.target.closest("[data-remove]");
      const retryButton = event.target.closest("[data-retry]");
      if (removeButton) {
        event.stopPropagation();
        removeCity(removeButton.dataset.remove);
        return;
      }
      if (retryButton) {
        event.stopPropagation();
        loadCity(retryButton.dataset.retry, true);
        return;
      }
      const card = event.target.closest(".weather-card");
      if (!card) return;
      const rect = card.getBoundingClientRect();
      const ripple = document.createElement("span");
      ripple.className = "ripple-click";
      ripple.style.left = `${event.clientX - rect.left}px`;
      ripple.style.top = `${event.clientY - rect.top}px`;
      card.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);
    });

    openListButton.addEventListener("click", openWeatherList);
    document.getElementById("close-weather-list").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => {
      if (event.target === dialog) return dialog.close();
      const show = event.target.closest("[data-saved-show]");
      const remove = event.target.closest("[data-saved-remove]");
      const retry = event.target.closest("[data-retry]");
      if (show) {
        const city = findCity(show.dataset.savedShow);
        dialog.close();
        showCity(city);
      }
      if (remove) removeFromList(remove.dataset.savedRemove);
      if (retry) loadCity(retry.dataset.retry, true);
    });
    dialog.addEventListener("close", () => openListButton.focus());
    refreshButton.addEventListener("click", () => refreshAll(true));

    document.addEventListener("click", event => {
      if (!event.target.closest(".search-wrap")) closeSuggestions();
    });
    window.addEventListener("offline", () => showToast("网络已断开，将继续展示缓存天气", "☁"));
    window.addEventListener("online", () => {
      showToast("网络已恢复，正在更新天空", "✓");
      refreshAll(false);
    });
    setInterval(() => {
      if (document.visibilityState === "visible") refreshAll(false);
    }, CACHE_TTL);

    render();
    Promise.allSettled(state.mainCities.map(city => loadCity(city.id)));
  </script>
</body>
</html>
