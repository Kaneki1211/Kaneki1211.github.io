name: 构建并发布

# 提交到 main 就够了：这里会自动装依赖、打包、把产物推到 gh-pages。
# GitHub Pages 仍然从 gh-pages 分支发布，所以不需要改 Pages 的任何设置。

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 页面手动触发一次

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: blog-src/package-lock.json

      - name: 安装依赖
        working-directory: blog-src
        run: npm ci --no-audit --no-fund

      # build 脚本 = tsc 类型检查 → vite build → postbuild 把 dist 铺到仓库根
      - name: 构建
        working-directory: blog-src
        run: npm run build

      - name: 发布到 gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "构建产物与已发布内容一致，跳过部署"
            exit 0
          fi

          git commit -m "deploy: ${GITHUB_SHA:0:7} 由 Actions 自动构建"
          git push --force origin HEAD:gh-pages
          echo "已发布 $GITHUB_SHA 到 gh-pages"
