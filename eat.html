<!DOCTYPE html>
<html data-page-node-id="QUUMkXG5s5NiKeZgl6pfHu" lang="zh-CN">
<head data-page-node-id="WTXfCq2B8x4WOH6eviZ6t6">
<script data-page-node-id="QDmNzvl34zSeoUjaZT1ZRS" src="/page/page_comm/inject.js"></script>

<title data-page-node-id="vS8thjLZoARO9fmbYzJ1qL" data-pnid-children="XMOFnwjrMWaSHZKAwZDib6">吃了吗您 · 干饭盲盒工作台</title>
<style data-page-node-id="trPjseYYAECj9DIUjC2UZa" data-pnid-children="OIDq05kBNcYsceGWH0bCN9">
  :root{
    --bg:#fff3e3; --card:#ffffff; --ink:#2e2113; --sub:#9a7f6b;
    --orange:#ff7a2f; --orange-d:#f2641a; --yellow:#ffc41f; --red:#ff4d5e;
    --green:#2fc36b; --line:#f4e1c9; --shadow:0 5px 0 #eccba6;
    --pink:#ff7eb3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#fff3e3 0%,#ffe7d2 55%,#ffd9e6 100%);
    background-attachment:fixed;
    color:var(--ink);
    max-width:480px; margin:0 auto; min-height:100vh;
    padding-bottom:84px; position:relative; overflow-x:hidden;
  }
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(circle at 12% 18%, #ffe2b8 0 22px, transparent 23px),
      radial-gradient(circle at 88% 30%, #ffd7c2 0 30px, transparent 31px),
      radial-gradient(circle at 70% 82%, #ffe9a8 0 18px, transparent 19px),
      radial-gradient(circle at 22% 78%, #ffd9e0 0 26px, transparent 27px);
    opacity:.6;}
  .topbar{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:14px 16px 4px;}
  .logo{display:flex;align-items:center;justify-content:center;gap:2px;line-height:1;cursor:pointer;padding-bottom:2px;}
  .logo .lt{font-weight:900;font-size:27px;letter-spacing:1px;color:#ffe9cf;
    -webkit-text-stroke:1.8px #3a2a1a;text-shadow:1.5px 1.5px 0 rgba(58,42,26,.12);}
  .logo .lt i{display:inline-block;font-style:normal;}
  .logo .lt i:nth-child(1){transform:rotate(-11deg) translateY(5px);font-size:23px;}
  .logo .lt i:nth-child(2){transform:rotate(6deg) translateY(-8px);font-size:36px;}
  .logo .lt i:nth-child(3){transform:rotate(-4deg) translateY(3px);font-size:27px;}
  .logo .lt i:nth-child(4){transform:rotate(12deg) translateY(-5px);font-size:31px;}
  .logo:active{transform:scale(.97);}
  .subbar{display:flex;align-items:center;gap:8px;}
  .tagline{font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wallet{margin-left:auto;background:var(--card);border:3px solid var(--ink);
    border-radius:14px;padding:5px 10px;font-weight:800;font-size:14px;
    box-shadow:var(--shadow);position:relative;display:flex;align-items:center;gap:3px;}
  .wallet.low{background:#ffe0e0;border-color:var(--red);color:var(--red);}
  .wallet .set{margin-left:6px;font-size:11px;background:var(--ink);color:#fff;
    border-radius:8px;padding:2px 6px;cursor:pointer;}
  .barwrap{height:10px;background:#f0e2cf;border-radius:8px;margin:4px 14px 0;overflow:hidden;border:2px solid var(--ink);}
  .barfill{height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .4s;border-radius:6px;}
  .barfill.low{background:var(--red);}
  /* 标题统一干净粗体，与餐次卡片（早餐/中餐…）同款风格，无涂鸦 */
  .ttl,.todo h3,.secTitle,.modal .box h3{font-weight:900;color:var(--ink);}
  .mealcard .nm{letter-spacing:1px;}

  .todo{margin:8px 0 4px;background:var(--card);border:3px solid var(--ink);
    border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);}
  .todo h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px;}
  .crave-add{margin:0 14px 12px;background:linear-gradient(100deg,#fff3e0,#fff7ef);border:2px dashed var(--orange);
    border-radius:16px;padding:12px 14px;font-size:13px;color:var(--sub);line-height:1.5;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .1s;}
  .crave-add b{color:var(--orange-d);font-size:14px;}
  .crave-add:active{transform:scale(.98);}
  .sharebtn{display:block;width:100%;margin:14px 0 4px;background:var(--ink);color:#fff;border:none;
    border-radius:14px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);}
  .sharebtn:active{transform:scale(.98);}
  .todo .row{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;color:var(--sub);}
  .todo .row b{color:var(--ink);}
  .todo .row.alert b{color:var(--red);}
  .todo .row .go{margin-left:auto;font-size:11px;background:var(--orange);color:#fff;
    border-radius:10px;padding:3px 8px;cursor:pointer;border:none;}

  /* 主页网格：四卡大小一致，2列铺满 */
  .mealgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:10px 14px 16px;}
  .mealcard{background:var(--card);border:3px solid var(--ink);border-radius:20px;
    padding:20px 12px;text-align:center;box-shadow:var(--shadow);cursor:pointer;position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
    min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .mealcard:active{transform:scale(.95);box-shadow:0 2px 0 rgba(58,42,26,.25);}
  .mealcard:hover{transform:translateY(-2px);}
  .mealcard .nm{font-weight:900;font-size:18px;letter-spacing:1px;}
  .mealcard .ds{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5;}
  .mealcard .mic{width:46px;height:46px;margin:0 auto 8px;display:block;}
  .mealcard .pick{margin-top:8px;font-size:12px;background:var(--green);color:#fff;border-radius:10px;padding:4px 10px;display:inline-block;word-break:break-all;max-width:90%;}
  .mealcard.done{background:#f3fff6;}
  .mealcard.done::after{content:"已抽";position:absolute;top:8px;right:8px;
    background:var(--green);color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px;transform:rotate(6deg);}
  .mealcard.night{border-color:var(--ink);background:var(--card);}
  .mealcard.locked{opacity:1;cursor:pointer;}
  .mealcard.locked::after{content:"未抽";position:absolute;top:8px;right:8px;
    background:var(--yellow);color:var(--ink);font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px;transform:rotate(-4deg);}
  .mealcard .rebtn{margin-top:10px;align-self:center;background:var(--orange);color:#fff;border:none;
    border-radius:12px;padding:6px 14px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);
    transform:rotate(-2deg);}
  .mealcard .rebtn:active{transform:scale(.92) rotate(-2deg);}

  .page{padding:6px 14px 14px;display:none;}
  .page.on{display:block;}

  .mealhead{display:flex;align-items:center;gap:8px;margin:4px 0 10px;}
  .mealhead .back{font-size:20px;cursor:pointer;background:var(--card);border:2px solid var(--ink);
    border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .mealhead .ttl{font-weight:900;font-size:17px;}
  .mealhead .tip{margin-left:auto;font-size:11px;color:var(--sub);}

  /* 抽卡弹层（盖在主页之上） */
  .modal{position:fixed;inset:0;background:rgba(40,25,10,.5);display:none;align-items:center;justify-content:center;z-index:80;}
  .modal.on{display:flex;}
  .modal .box{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:18px;width:90%;max-width:360px;max-height:92vh;overflow:auto;box-shadow:0 8px 0 #e8d4ba;}
  .modal .box h3{margin:0 0 10px;font-size:17px;}
  .modal .box input{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px;font-size:18px;margin-bottom:12px;font-family:inherit;}
  .modal .box .mbtns{display:flex;gap:10px;}
  .modal .box .mbtns button{flex:1;border:3px solid var(--ink);border-radius:12px;padding:10px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:var(--shadow);}
  .modal .box .mbtns .ok{background:var(--orange);color:#fff;}
  .modal .box .mbtns .no{background:#eee;color:var(--sub);}
  .quickrow{display:flex;gap:8px;margin-bottom:12px;}
  .quickrow .qbtn{flex:1;border:2px solid var(--ink);border-radius:10px;padding:8px 4px;font-weight:800;font-size:13px;cursor:pointer;background:#fff7e9;color:var(--ink);box-shadow:var(--shadow);}
  .quickrow .qbtn:active{transform:scale(.94);}
  .quickrow .qbtn.rst{background:#ffe6cf;}
  .addin{display:flex;align-items:center;gap:4px;flex:2;border:2px solid var(--ink);border-radius:10px;padding:4px 6px;background:#fff;}
  .addin span{font-weight:900;color:var(--sub);font-size:14px;}
  .addin input{width:46px;border:none;outline:none;font-size:14px;font-weight:800;color:var(--ink);text-align:center;}
  .addin .qbtn{flex:none;padding:6px 12px;border:2px solid var(--ink);border-radius:8px;background:var(--orange);color:#fff;}
  #nightPig svg{width:120px;height:120px;transition:transform .12s;}
  #nightPig.tap svg{transform:scale(.85) rotate(-7deg);}

  .stage{display:flex;justify-content:center;min-height:300px;align-items:center;position:relative;}
  .gacha{width:230px;border:4px solid var(--ink);border-radius:20px;background:var(--card);
    box-shadow:0 8px 0 #e8d4ba, 0 0 0 6px #fff inset;padding:14px;position:relative;overflow:hidden;}
  .gacha.shake{animation:shk .12s linear 6;}
  @keyframes shk{0%{transform:translateX(-6px) rotate(-2deg);}50%{transform:translateX(6px) rotate(2deg);}100%{transform:translateX(0) rotate(0);}}
  .gacha .rart{font-size:11px;font-weight:900;letter-spacing:1px;}
  .gacha .rar-n{color:#9a8a7a;} .gacha .rar-r{color:var(--orange-d);} .gacha .rar-l{color:#c038ff;}
  .gacha .rar-l{text-shadow:0 0 8px #e0a3ff;}
  .gacha .ill{height:128px;display:flex;align-items:center;justify-content:center;margin:6px 0;}
  .gacha .ill svg{width:118px;height:118px;}
  .gacha .fname{font-weight:900;font-size:19px;text-align:center;}
  .gacha .ftags{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:6px 0;}
  .tag{font-size:11px;border-radius:9px;padding:2px 7px;border:2px solid var(--ink);font-weight:700;}
  .tag.taste-tian{background:#ffd9ec;color:#c2185b;}
  .tag.taste-xian{background:#ffe6b3;color:#a86b00;}
  .tag.taste-la{background:#ffc9c0;color:#d32f2f;}
  .tag.taste-suan{background:#d9f0c0;color:#5a8a1a;}
  .tag.taste-ku{background:#e0d4c0;color:#7a5a3a;}
  .tag.kcal{background:#e8f0ff;color:#2a5aa8;}
  .tag.crave{background:var(--yellow);}
  .gacha .fdesc{font-size:12px;color:var(--sub);text-align:center;min-height:32px;line-height:1.4;}
  .gacha .fprice{text-align:center;font-weight:800;font-size:13px;margin-top:4px;color:var(--orange-d);}
  .gacha.eating{animation:eat .55s forwards;}
  @keyframes eat{0%{transform:scale(1);}40%{transform:scale(1.08) rotate(-3deg);}100%{transform:scale(.1) rotate(20deg);opacity:0;}}
  .gacha.trashing{animation:trash .55s forwards;}
  @keyframes trash{0%{transform:translate(0,0) rotate(0);}60%{transform:translate(0,-30px) rotate(-12deg);}100%{transform:translate(0,360px) rotate(40deg);opacity:0;}}
  .actrow{display:none;gap:10px;justify-content:center;margin-top:14px;}
  .actrow button{font-size:15px;font-weight:800;border:3px solid var(--ink);border-radius:14px;
    padding:10px 14px;cursor:pointer;box-shadow:var(--shadow);background:var(--card);}
  .actrow .eat{background:var(--green);color:#fff;}
  .actrow .toss{background:#cfcfcf;color:var(--ink);}
  /* 揭卡动效升级：神秘面 → 翻牌揭晓 + 稀有光环 + 撒花 */
  .gacha.mystery{display:flex;align-items:center;justify-content:center;font-size:46px;
    color:var(--orange-d);font-weight:900;min-height:200px;letter-spacing:2px;}
  .gacha.reveal{animation:pop .55s cubic-bezier(.2,1.5,.4,1);}
  @keyframes pop{0%{transform:scale(.55) rotateY(90deg);opacity:0;}
    60%{transform:scale(1.08) rotateY(0);opacity:1;}100%{transform:scale(1);}}
  .gacha.reveal.rar-r{box-shadow:0 0 16px var(--orange), var(--shadow);border-color:var(--orange-d);}
  .gacha.reveal.rar-l{box-shadow:0 0 22px #c87bff, var(--shadow);border-color:#a64bff;}
  .confetti{position:absolute;width:9px;height:9px;border-radius:2px;pointer-events:none;top:46%;left:50%;z-index:5;}
  @keyframes confettiGo{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(540deg);opacity:0;}}
  .pullbtn{display:block;margin:14px auto 0;font-size:18px;font-weight:900;color:#fff;
    background:var(--orange);border:3px solid var(--ink);border-radius:16px;padding:12px 26px;
    cursor:pointer;box-shadow:var(--shadow);}
  .homebtn{display:none;margin:14px auto 0;font-size:16px;font-weight:800;color:var(--ink);
    background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:11px 24px;cursor:pointer;box-shadow:var(--shadow);}
  .careword{display:none;text-align:center;font-size:15px;font-weight:800;color:var(--orange-d);
    background:#fff3e0;border:2px dashed var(--orange);border-radius:14px;padding:14px;margin-top:14px;line-height:1.5;}
  .grate{text-align:center;font-size:11px;color:var(--sub);margin-top:12px;letter-spacing:.3px;}
  .trashbin{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:60px;height:60px;
    display:none;z-index:85;pointer-events:none;}
  .trashbin.show{display:block;animation:binpop .3s;}
  @keyframes binpop{from{transform:translateX(-50%) scale(.4);}to{transform:translateX(-50%) scale(1);}}
  .danuchan{position:fixed;left:0;top:30%;width:100%;height:0;pointer-events:none;z-index:85;overflow:visible;}
  .danmu{position:absolute;white-space:nowrap;font-weight:900;font-size:18px;color:var(--orange-d);
    text-shadow:1px 1px 0 #fff;animation:dm 2.4s linear forwards;}
  @keyframes dm{from{left:100%;}to{left:-40%;}}

  /* 菜品池目录 */
  .addbox{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);}
  .addbox input,.addbox textarea,.addbox select{width:100%;border:2px solid var(--line);border-radius:10px;
    padding:9px;font-size:16px;margin-bottom:8px;font-family:inherit;background:#fffdf8;}
  .addbox .lbl{font-size:12px;color:var(--sub);margin-bottom:2px;font-weight:700;}
  .addbox .twocol{display:flex;gap:8px;}
  .addbox .twocol>div{flex:1;}
  .savebtn{width:100%;background:var(--orange);color:#fff;border:3px solid var(--ink);border-radius:14px;
    padding:11px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);}
  .secTitle{font-size:14px;font-weight:900;margin:14px 2px 6px;display:flex;align-items:center;gap:6px;}
  .secTitle .ct{margin-left:auto;font-size:11px;color:var(--sub);font-weight:700;}
  .collapseBtn{flex:none;font-size:12px;font-weight:800;color:var(--orange-d);background:var(--yellow);
    border:2px solid var(--ink);border-radius:10px;padding:2px 9px;cursor:pointer;transform:rotate(-3deg);}
  .collapseBtn:active{transform:scale(.94) rotate(-3deg);}
  .tastechips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .tastechips .chip{font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:9px;padding:2px 9px;cursor:pointer;background:var(--card);}
  .tastechips .chip.on{background:var(--orange);color:#fff;}
  .tastechips .chip:active{transform:scale(.94);}
  .rarow{display:flex;gap:8px;margin:4px 0 10px;}
  .rarow .rchip{flex:1;text-align:center;font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:12px;padding:6px 2px;cursor:pointer;background:var(--card);box-shadow:var(--shadow);}
  .rarow .rchip.on{background:var(--orange);color:#fff;}
  .rarow .rchip:active{transform:scale(.94);}
  .textlist{display:flex;flex-direction:column;gap:8px;}
  .titem{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:10px;position:relative;}
  .titem .badge{font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px;border:2px solid var(--ink);flex:none;}
  .titem .badge.tian{background:#ffd9ec;color:#c2185b;} .titem .badge.xian{background:#ffe6b3;color:#a86b00;}
  .titem .badge.la{background:#ffc9c0;color:#d32f2f;} .titem .badge.suan{background:#d9f0c0;color:#5a8a1a;}
  .titem .badge.ku{background:#e0d4c0;color:#7a5a3a;}
  .titem .main{flex:1;min-width:0;}
  .titem .main .n{font-weight:900;font-size:15px;}
  .titem .main .d{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.35;}
  .titem .meta{font-size:11px;color:var(--sub);flex:none;text-align:right;}
  .titem.craveOnly{background:#fffaf0;border-style:dashed;}
  .titem .star{position:absolute;top:6px;right:8px;font-size:9px;background:var(--yellow);color:var(--ink);border-radius:7px;padding:1px 5px;font-weight:800;}
  .titem .del{flex:none;width:18px;height:18px;cursor:pointer;opacity:.55;display:flex;align-items:center;justify-content:center;}
  .titem .del svg{width:18px;height:18px;display:block;}
  .titem .del:active{opacity:1;transform:scale(.9);}

  /* 记录页 */
  .datebar{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
  .datebar input{flex:1;border:2px solid var(--line);border-radius:10px;padding:9px;font-size:15px;font-family:inherit;background:#fffdf8;}
  .datebar button{background:var(--orange);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);font-size:14px;}
  .reccard{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);}
  .reccard .h{font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .reccard .h .miss{margin-left:auto;font-size:11px;background:#eee;color:#999;border-radius:8px;padding:2px 6px;}
  .reccard .body .n{font-weight:800;font-size:15px;}
  .reccard .body .d{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.4;}
  .rectotal{background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:12px;text-align:center;font-weight:900;box-shadow:var(--shadow);}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:24px;}

  /* 连续打卡面板 */
  .streak{display:flex;flex-direction:column;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);}
  .streak-main{display:flex;align-items:center;gap:12px;}
  .streak-main .fire{font-size:34px;line-height:1;filter:drop-shadow(0 2px 0 #eccba6);}
  .streak-num{font-weight:900;font-size:30px;color:var(--orange-d);line-height:1;}
  .streak-num span{font-size:15px;color:var(--sub);font-weight:800;}
  .streak-sub{font-size:12px;color:var(--sub);margin-top:3px;font-weight:700;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0 4px;}
  .cal .cc{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;border:2px solid var(--line);border-radius:9px;color:var(--sub);background:#fffaf2;}
  .cal .cc.on{background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;border-color:var(--orange-d);box-shadow:0 2px 0 #eccba6;}
  .ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px;}
  .ach .badge{display:flex;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:12px;padding:7px 9px;opacity:.55;}
  .ach .badge.got{border-style:solid;border-color:var(--orange-d);background:#fff4e8;opacity:1;}
  .ach .badge .bt{font-size:18px;line-height:1;}
  .ach .badge .bx{font-size:11px;font-weight:800;color:var(--sub);line-height:1.25;}
  .ach .badge.got .bx{color:var(--orange-d);}

/* shim 公共：把 {text/select/number/...} 单元格对象压成标量，复用上面的 pv() */
function scalarProps(props){
  var o={}, k;
  for(k in props){ if(Object.prototype.hasOwnProperty.call(props,k)) o[k]=pv(props[k]); }
  return o;
}
function apiFetch(p, opt){
  opt=opt||{};
  opt.cache="no-store";
  if(opt.body!=null) opt.headers={"Content-Type":"application/json"};
  return fetch("/api"+p, opt).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){
        var e=new Error("HTTP "+r.status+(t?(" "+t):""));
        e.status=r.status;
        throw e;
      });
    }
    return r.json();
  });
}

/* ---- local：完全模仿平台 SDK 的四个方法，内部走 /api/pool|recs ---- */
function makeApiDb(){
  var bc=null;
  try{ bc=new BroadcastChannel("chilema-db"); }catch(e){}
  function notify(){ if(bc){ try{ bc.postMessage(1); }catch(e){} } }
  return {
    query:function(o){
      var k=kindOf(o&&o.databaseId);
      if(!k) return Promise.reject(new Error("unknown databaseId"));
      return apiFetch("/"+k).then(function(j){
        return { results:(j&&j.rows)||[], hasMore:false };   // hasMore 必须 false，否则 qPool 会一直翻页
      });
    },
    addRecord:function(o){
      var k=kindOf(o&&o.databaseId);
      if(!k) return Promise.reject(new Error("unknown databaseId"));
      return apiFetch("/"+k,{method:"POST",body:JSON.stringify({fields:scalarProps(o.properties||{})})})
        .then(function(j){ notify(); return { record_id:(j&&j.record_id)||"" }; });
    },
    deleteRecord:function(o){
      var k=kindOf(o&&o.databaseId);
      if(!k) return Promise.reject(new Error("unknown databaseId"));
      if(!o.recordId) return Promise.resolve({ ok:true });
      return apiFetch("/"+k+"/"+encodeURIComponent(o.recordId),{method:"DELETE"})
        .then(function(){ notify(); return { ok:true }; });
    },
    onUpdated:function(cb){
      if(bc) bc.onmessage=function(){ cb(); };
      document.addEventListener("visibilitychange",function(){
        if(document.visibilityState==="visible") cb();
      });
    }
  };
}

/* ---- static：内嵌快照 → localStorage（GitHub Pages / file://） ---- */
function parseCsvText(text){
  if(typeof text!=="string") text="";
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  var rows=[], row=[], f="", q=false, i, c;
  function endRow(){ row.push(f); rows.push(row); row=[]; f=""; }
  for(i=0;i<text.length;i++){
    c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else { q=false; } }
      else f+=c;
      continue;
    }
    if(c==='"'){ q=true; }
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\r"){ if(text[i+1]==="\n") i++; endRow(); }
    else if(c==="\n"){ endRow(); }
    else f+=c;
  }
  if(f!==""||row.length) endRow();
  return rows.filter(function(r){ return !(r.length===1&&r[0]===""); });
}
function csvCell(v){
  var s=(v==null?"":String(v));
  return /[",\r\n]/.test(s)||/^\s|\s$/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function typedFromRaw(kind,col,raw){
  if(NUM_COLS[kind].indexOf(col)>=0){
    var n=Number(String(raw==null?"":raw).replace(/[¥￥$,\s]/g,""));
    return isFinite(n)?n:0;
  }
  if(BOOL_COLS[kind].indexOf(col)>=0) return /^(true|1|是|yes|y)$/i.test(String(raw==null?"":raw).trim());
  if(MULTI_COLS[kind].indexOf(col)>=0){
    return String(raw==null?"":raw).split(/[,，、]/).map(function(x){ return x.trim(); }).filter(Boolean);
  }
  return String(raw==null?"":raw).trim();
}
function rawFromTyped(kind,col,v){
  if(NUM_COLS[kind].indexOf(col)>=0){ var n=Number(v); return isFinite(n)?String(n):""; }
  if(BOOL_COLS[kind].indexOf(col)>=0) return (v===true||v==="true")?"true":"false";
  if(MULTI_COLS[kind].indexOf(col)>=0){
    var arr=Array.isArray(v)?v:String(v==null?"":v).split(/[,，、]/);
    return arr.map(function(x){ return String(x).trim(); }).filter(Boolean).join(",");
  }
  return v==null?"":String(v).trim();
}
function tableToCsv(kind, header, rows){
  var lines=[header.map(csvCell).join(",")];
  rows.forEach(function(r){
    lines.push(header.map(function(col){ return csvCell(rawFromTyped(kind,col,r[col])); }).join(","));
  });
  return "\uFEFF"+lines.join("\r\n")+"\r\n";   // 与仓库里的 CSV 同格式：BOM + CRLF
}
function snapshotText(kind){
  var el=document.getElementById("snap-"+kind);
  return el?el.textContent:"";
}
function readStore(kind){
  try{
    var s=JSON.parse(localStorage.getItem(STORE_KEYS[kind]));
    if(s&&s.header&&s.rows) return s;
  }catch(e){}
  return null;
}
function writeStore(kind, st){
  try{ localStorage.setItem(STORE_KEYS[kind], JSON.stringify(st)); }catch(e){ console.warn("[static] localStorage 写入失败", e); }
}
function storeFromCsvText(kind, text){
  var all=parseCsvText(text);
  var header=(all.shift()||[]).map(function(h){ return h.trim(); });
  var rows=all.map(function(cells,i){
    var o={ record_id:kind+"-s"+(i+1) };
    header.forEach(function(col,ci){ o[col]=typedFromRaw(kind,col,cells[ci]); });
    return o;
  });
  return { header:header, rows:rows, seq:rows.length };
}
function fetchText(url){
  return fetch(url,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  });
}
function seedStore(){
  // file:// 下 fetch 本地 CSV 必然被 CORS 拦（还会在控制台刷红），直接用内嵌快照
  if(location.protocol==="file:"){
    var p0=storeFromCsvText("pool", snapshotText("pool"));
    var r0=storeFromCsvText("recs", snapshotText("recs"));
    writeStore("pool",p0); writeStore("recs",r0);
    return Promise.resolve({ pool:p0, recs:r0 });
  }
  // http(s) 下优先读仓库里最新的 CSV（Pages 同源可读），读不到再用快照
  return Promise.all([
    fetchText(TABLE_FILES.pool).catch(function(){ return snapshotText("pool"); }),
    fetchText(TABLE_FILES.recs).catch(function(){ return snapshotText("recs"); })
  ]).then(function(txts){
    var pool=storeFromCsvText("pool", txts[0]||snapshotText("pool"));
    var recs=storeFromCsvText("recs", txts[1]||snapshotText("recs"));
    writeStore("pool",pool); writeStore("recs",recs);
    return { pool:pool, recs:recs };
  });
}
function makeStaticDb(stores){
  var mem=stores;
  function persist(kind){ writeStore(kind, mem[kind]); }
  return {
    query:function(o){
      var k=kindOf(o&&o.databaseId);
      if(!k) return Promise.reject(new Error("unknown databaseId"));
      return Promise.resolve({ results:mem[k].rows.slice(), hasMore:false });
    },
    addRecord:function(o){
      var k=kindOf(o&&o.databaseId);
      if(!k) return Promise.reject(new Error("unknown databaseId"));
      var st=mem[k], props=scalarProps(o.properties||{}), row={};
      st.header.forEach(function(col){ row[col]=typedFromRaw(k,col,props[col]); });
      if(k==="recs"&&row["状态"]==="已吃"){
        for(var i=0;i<st.rows.length;i++){
          var r=st.rows[i];
          if(r["日期"]===row["日期"]&&r["餐次"]===row["餐次"]&&r["状态"]==="已吃"){
            row.record_id=r.record_id; st.rows[i]=row; persist(k);
            return Promise.resolve({ record_id:row.record_id });
          }
        }
      }
      st.seq=(st.seq||0)+1;
      row.record_id=k+"-s"+st.seq;
      st.rows.push(row); persist(k);
      return Promise.resolve({ record_id:row.record_id });
    },
    deleteRecord:function(o){
      var k=kindOf(o&&o.databaseId);
      if(!k) return Promise.reject(new Error("unknown databaseId"));
      var st=mem[k], hit=-1;
      for(var i=0;i<st.rows.length;i++){ if(st.rows[i].record_id===o.recordId){ hit=i; break; } }
      if(hit>=0){ st.rows.splice(hit,1); persist(k); }
      return Promise.resolve({ ok:true, deleted:hit>=0?1:0 });
    },
    onUpdated:function(cb){
      window.addEventListener("storage",function(e){
        if(e.key===STORE_KEYS.pool||e.key===STORE_KEYS.recs) cb();
      });
      document.addEventListener("visibilitychange",function(){
        if(document.visibilityState==="visible") cb();
      });
    }
  };
}
function prepareStatic(){
  var pool=readStore("pool"), recs=readStore("recs");
  if(pool&&recs) return Promise.resolve(makeStaticDb({ pool:pool, recs:recs }));  // 有本地改动就别覆盖
  return seedStore().then(function(s){ return makeStaticDb(s); });
}

function probeLocal(){
  if(location.protocol==="file:") return Promise.resolve(false);
  return new Promise(function(resolve){
    var done=false, tm=setTimeout(function(){ fin(false); },1500);
    function fin(v){ if(done) return; done=true; clearTimeout(tm); resolve(v); }
    fetch("/api/health",{cache:"no-store"}).then(function(r){

      if(!r.ok||ct.indexOf("application/json")<0) throw new Error("not local api");
      return r.json();
    }).then(function(j){ fin(!!(j&&j.ok&&j.mode==="local")); }).catch(function(){ fin(false); });
  });
}

function normMeals(v){ if(Array.isArray(v)) return v.filter(function(x){ return x!=null && x!==""; }); if(v==null||v==="") return []; return [String(v)]; }
function qPool(cur, acc, guard){
  var db=sdk(); if(!db) return Promise.reject(new Error("database unavailable"));
  acc=acc||[]; guard=guard||0; if(guard>100) return Promise.resolve(acc);
  return db.query(cur?{databaseId:'6dtyz7cnWmpMLgoDwKevuK',pageSize:200,startCursor:cur}:{databaseId:'6dtyz7cnWmpMLgoDwKevuK',pageSize:200}).then(function(res){
    ((res&&res.results)||[]).forEach(function(r){ acc.push(r); });
    if(res&&res.hasMore&&res.nextCursor&&acc.length<2500){ return qPool(res.nextCursor, acc, guard+1); }
    return acc;
  }).catch(function(err){ return Promise.reject(err); });
}
function qRec(cur, acc, guard){
  var db=sdk(); if(!db) return Promise.reject(new Error("database unavailable"));
  acc=acc||[]; guard=guard||0; if(guard>100) return Promise.resolve(acc);
  return db.query(cur?{databaseId:'5xbHEQBJckZzT0Bqu7zbTk',pageSize:200,startCursor:cur}:{databaseId:'5xbHEQBJckZzT0Bqu7zbTk',pageSize:200}).then(function(res){

    if(res&&res.hasMore&&res.nextCursor&&acc.length<2500){ return qRec(res.nextCursor, acc, guard+1); }
    return acc;
  }).catch(function(err){ return Promise.reject(err); });
}

function rebuildPool(){
  state.base={"早餐":[],"中餐":[],"晚餐":[],"宵夜":[]};
  state.crave=[];
  POOL_LIST.forEach(function(r){
    if(r.src==="自己加"){ state.crave.push({name:r.name,taste:r.taste,kcal:r.kcal,price:r.price,desc:r.desc,meal:"馋",rar:r.rar,rid:r.rid}); return; }
    normMeals(r.meal).forEach(function(m){ if(state.base[m]) state.base[m].push({name:r.name,taste:r.taste,kcal:r.kcal,price:r.price,desc:r.desc,rar:r.rar,rid:r.rid}); });
  });
}
function rebuildToday(){
  state.today={};
  REC_LIST.forEach(function(r){
    if(r.status!=="已吃" || !r.date || !r.meal) return;
    if(!state.today[r.date]) state.today[r.date]={};
    state.today[r.date][r.meal]={name:r.name,taste:r.taste,kcal:r.kcal,price:r.price,rar:rarCode(r.rar)};
  });
}

/* ============ 连续打卡 ============ */
function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function markCheckin(){ /* 在线版：打卡由吃饭记录派生，无需单独写入 */ }
function checkinDays(){ var d={},k,m; for(k in state.today){ m=state.today[k]||{}; if(m["早餐"]||m["中餐"]||m["晚餐"]||m["宵夜"]) d[k]=true; } return d; }
function bestStreakCalc(){ var ks=Object.keys(checkinDays()).sort(), best=0, run=0, prev=null, i, cur, pd;
  for(i=0;i<ks.length;i++){ cur=new Date(ks[i]+"T00:00:00"); pd=prev?new Date(prev+"T00:00:00"):null; run=(pd&&(cur-pd)===86400000)?run+1:1; if(run>best) best=run; prev=ks[i]; }
  return best; }
function computeStreak(){
  var c=checkinDays(), d=new Date(), streak=0;
  if(!c[todayKey()]) d.setDate(d.getDate()-1); // 今天还没打卡则从昨天起算
  while(c[keyOf(d)]){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function burstConfetti(){
  var stage=document.getElementById("stage"); if(!stage) return;
  var colors=["#ff7a2f","#ffc41f","#ff4d5e","#2fc36b","#ff7eb3","#a64bff"];
  for(var i=0;i<18;i++){
    var p=document.createElement("div"); p.className="confetti";
    var ang=Math.random()*Math.PI*2, dist=60+Math.random()*120;
    p.style.setProperty("--dx",(Math.cos(ang)*dist).toFixed(0)+"px");
    p.style.setProperty("--dy",(Math.sin(ang)*dist - 40).toFixed(0)+"px");
    p.style.background=colors[i%colors.length];
    p.style.animation="confettiGo "+(0.8+Math.random()*0.5).toFixed(2)+"s ease-out forwards";
    stage.appendChild(p);
    (function(el){ setTimeout(function(){ el.remove(); },1300); })(p);
  }
}

function fullPool(meal){
  var arr = (state.base && state.base[meal]) ? state.base[meal].slice() : [];
  state.crave.forEach(function(c){ arr.push({name:c.name,taste:c.taste,kcal:c.kcal,price:c.price,desc:c.desc,rar:"n",crave:true}); });
  return arr;
}
function drawCard(pool){
  if(!pool||!pool.length) return null;
  var roll=Math.random();
  var t = roll<0.70?"n":(roll<0.95?"r":"l");
  var f=pool.filter(function(p){return p.rar===t;});
  if(!f.length) f=pool;
  return f[Math.floor(Math.random()*f.length)];
}
function makeCard(it){
  var rarTxt = it.rar==="n"?"普通 N":(it.rar==="r"?"稀有 R":"限定 L");
  var rarCls = it.rar==="n"?"rar-n":(it.rar==="r"?"rar-r":"rar-l");
  var tasteMap={甜:"tian",咸:"xian",辣:"la",酸:"suan",苦:"ku"};
  var tk = tasteMap[it.taste]||"xian";
  return '<div class="gacha" id="gachaCard">'
    + '<div class="rart '+rarCls+'">'+rarTxt+(it.crave?' · 馋了':'')+'</div>'
    + '<div class="ill">'+art(it.name)+'</div>'
    + '<div class="fname">'+it.name+'</div>'
    + '<div class="ftags"><span class="tag taste-'+tk+'">'+it.taste+'</span>'
    + '<span class="tag kcal">'+it.kcal+' kcal</span>'
    + (it.crave?'<span class="tag crave">馋了</span>':'')+'</div>'
    + '<div class="fdesc">'+it.desc+'</div>'
    + '<div class="fprice">预估 ¥'+it.price+'（收下才扣饭票）</div>'
    + '</div>';
}

/* 菜品池目录：基础池(state.base) + 我加的(馋了) + 新发现(抽中没见过的)，有界、不随抽卡无限增长 */
function catalog(){
  var seen={}, items=[];
  function add(o,src,meal){ var key=o.name; if(seen[key]) return; seen[key]=1; items.push({name:o.name,taste:o.taste,kcal:o.kcal,price:o.price,desc:o.desc,src:src,meal:meal,rid:o.rid}); }
  ["早餐","中餐","晚餐","宵夜"].forEach(function(m){
    (state.base[m]||[]).forEach(function(p){ add(p,"基础",m); });
  });
  state.crave.forEach(function(c){ add(c,"我加的",c.meal||"馋"); });
  Object.keys(state.owned).forEach(function(k){ var o=state.owned[k]; add(o,o.src||"新发现",o.meal||"馋"); });
  return items;
}

function delDish(o){
  var db=sdk(); if(!db){ dbFail(); return; }
  function doDel(){
    var isCrave=(o.src==="我加的");
    var row=null;
    if(o.rid){ POOL_LIST.forEach(function(r){ if(!row && r.rid===o.rid) row=r; }); }
    if(!row){ POOL_LIST.forEach(function(r){ if(!row && r.name===o.name && ((isCrave&&r.src==="自己加")||(!isCrave&&r.src==="默认池"))) row=r; }); }
    if(!row || !row.rid){ toast("删除失败，请重试"); return; }
    db.deleteRecord({databaseId:'6dtyz7cnWmpMLgoDwKevuK', recordId:row.rid}).then(function(){ return reloadPool(); }).then(function(){ renderCatalog(); renderHome(); }).catch(function(err){ console.error("[database] 删除失败:", err); toast("删除失败，请重试"); });
  }
  if(o.src==="基础"){
    confirmBox("删掉这道菜？","「"+o.name+"」来自默认池，删除后不可恢复"+(DATA_MODE==="local"?"（会直接改 菜品池.csv，同目录有 .bak 备份）":"")+"。",doDel);
    return;
  }
  doDel();
}

function doEat(meal){
  var card=document.getElementById("gachaCard"); if(!card) return;
  card.classList.add("eating");
  var db=sdk(); if(!db){ dbFail(); return; }
  var key=todayKey();
  var walletBefore=state.wallet;
  var od=currentItem.price>walletBefore; // 透支吃下时记录透支标记（允许余额为负）
  var props={ "日期":{date:key}, "餐次":{select:meal}, "菜名":{text:currentItem.name}, "口味":{text:currentItem.taste}, "大卡":{number:currentItem.kcal}, "价格":{currency:currentItem.price}, "稀有度":{select:rarName(currentItem.rar)}, "状态":{select:"已吃"}, "是否透支":{checkbox:od} };
  var old=recRid(key,meal); // 同餐重吃防御：先删旧记录再写
  var wr = old ? db.deleteRecord({databaseId:'5xbHEQBJckZzT0Bqu7zbTk', recordId:old}).then(function(){ return db.addRecord({databaseId:'5xbHEQBJckZzT0Bqu7zbTk', properties:props}); }).catch(function(err){ return Promise.reject(err); })
               : db.addRecord({databaseId:'5xbHEQBJckZzT0Bqu7zbTk', properties:props}).catch(function(err){ return Promise.reject(err); });
  wr.then(function(){ return reloadRecs(); }).then(function(){
    syncWallet(); save(); renderWallet(); renderHome();
    setTimeout(function(){
      document.getElementById("actRow").style.display="none";
      var cw=document.getElementById("careWord");
      cw.textContent=CARE[Math.floor(Math.random()*CARE.length)];
      cw.style.display="block";
      document.getElementById("pullBtn").style.display="none";
      document.getElementById("homeBtn").style.display="block";
      toast("炫完啦！（"+meal+"已记录）");
    },560);
  }).catch(function(err){
    console.error("[database] 写入失败:", err);
    // .eating 动画是 forwards → opacity:0，失败时不移除会让卡片永久隐形
    card.classList.remove("eating");
    document.getElementById("actRow").style.display="flex";
    toast(DATA_MODE==="local" ? "本地保存失败，请检查 node server.js 是否在运行" : "记录同步失败，请重试");
  });
}

/* ============ 生成今日三餐分享卡 ============ */
document.getElementById("genCard").onclick=function(){
  var rec=state.today[todayKey()]||{};
  var cv=document.createElement("canvas"); cv.width=600; cv.height=820;
  var c=cv.getContext("2d");
  // 背景
  var g=c.createLinearGradient(0,0,0,820); g.addColorStop(0,"#fff3d6"); g.addColorStop(1,"#ffe6f0");
  c.fillStyle=g; c.fillRect(0,0,600,820);
  // 标题
  c.fillStyle="#3a2a1a"; c.font="900 34px sans-serif"; c.textAlign="center";
  c.fillText(__T("今天，我吃了这些","Today, I ate these"),300,70);
  c.fillStyle="#8a7060"; c.font="600 16px sans-serif";
  c.fillText(todayKey()+" · "+__T("干饭人专属卡片","a foodie's daily card"),300,100);
  var meals=["早餐","中餐","晚餐"]; var y=160; var totK=0; var any=false;
  meals.forEach(function(m){
    var it=rec[m];
    // 卡片块
    c.fillStyle="#ffffff"; roundRect(c,40,y,520,170,18); c.fill();
    c.strokeStyle="#3a2a1a"; c.lineWidth=3; roundRect(c,40,y,520,170,18); c.stroke();
    c.textAlign="left";
    c.fillStyle="#3a2a1a"; c.font="900 22px sans-serif"; c.fillText(__trM(m),64,y+42);
    if(it){
      any=true; totK+=it.kcal;
      c.fillStyle="#ff8a3d"; c.font="900 26px sans-serif";
      c.fillText(truncate(c,__tr(it.name),360),64,y+86);
      c.fillStyle="#8a7060"; c.font="600 16px sans-serif";
      c.fillText(__tr(it.taste)+" · "+it.kcal+" kcal · ¥"+it.price,64,y+122);
    } else {
      c.fillStyle="#bbb"; c.font="600 20px sans-serif";
      c.fillText(__T("还没抽这一餐～","Not drawn yet~"),64,y+92);
    }
    y+=190;
  });
  // 底部
  c.textAlign="center";
  c.fillStyle="#f2701c"; c.font="900 22px sans-serif";
  c.fillText(any?(__T("今日合计 ","Total today ")+totK+" kcal 🍚"):__T("今天还没开动呢，去抽卡吧！","Nothing yet — go draw your meals!"),300,y+10);
  c.fillStyle="#8a7060"; c.font="700 15px sans-serif";
  c.fillText(__T("—— 吃了吗您 · 干饭也要仪式感 ——","—— Chi Le Ma Nin · every meal deserves a little ceremony ——"),300,y+44);
  var wrap=document.getElementById("cardCanvasWrap"); wrap.innerHTML="";
  cv.style.width="100%"; cv.style.display="block"; wrap.appendChild(cv);
  document.getElementById("cardModal").classList.add("on");
};

function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function truncate(c,t,maxw){ if(c.measureText(t).width<=maxw) return t; while(t.length>1 && c.measureText(t+"…").width>maxw){ t=t.slice(0,-1); } return t+"…"; }

function dbStart(db){
  Promise.all([reloadPool(), reloadRecs()]).then(function(){ syncWallet(); renderWallet(); renderHome(); renderCatalog(); renderRecord(); }).catch(function(err){ console.error("[database] 初始化读取失败:", err); toast("数据加载失败，请刷新重试"); });
  if(db && typeof db.onUpdated==="function"){
    var _sy=null;
    db.onUpdated(function(){
      if(_sy) return;
      _sy=setTimeout(function(){ _sy=null; Promise.all([reloadPool(),reloadRecs()]).then(function(){ syncWallet(); renderWallet(); renderHome(); renderCatalog(); renderRecord(); }).catch(function(){}); },400);
    });
  }
}
(function(){

  if(ep) ep.onclick=function(){ downloadCsv("pool"); };
  if(er) er.onclick=function(){ downloadCsv("recs"); };
  if(rs) rs.onclick=function(){ resetStaticData(); };
})();
(function boot(){
  var pdb=platformDb();
  if(pdb){ DATA_MODE="platform"; showDbTools(false); dbStart(pdb); return; }
  probeLocal().then(function(ok){
    if(ok){
      DATA_MODE="local";
      LOCAL_DB=makeApiDb();
      showDbTools(false);
      dbStart(LOCAL_DB);
      return;
    }
    return prepareStatic().then(function(sdb){
      DATA_MODE="static";
      LOCAL_DB=sdb;
      showDbTools(true);
      modeHint("演示模式：数据只存在本浏览器，「导出 CSV」可写回仓库；本地运行 <b>node server.js</b> 则直接读写 CSV。");
      dbStart(LOCAL_DB);
    });
  }).catch(function(err){
    console.error("[database] 初始化失败:", err);
    toast("数据加载失败，请刷新重试");
  });
})();
